#macroContainer {
   display: grid;
   grid-template-columns: repeat(2, 1fr); /* Crea le due colonne */

}

    #macroContainer { grid-template-columns: 1fr; }

.sotto-card:hover .remove-card{display:flex}
.edit-sotto-card{opacity:0.5;transition:opacity .2s}
.sotto-card:hover .edit-sotto-card{opacity:1}
.sotto-card.drag-over-card{border:2px solid #8b5cf6;background:#f5f3ff}
.sotto-card.is-group{border-left:3px solid #8b5cf6}

var confirmCb = null;
var draggedCardId = null;
var draggedFromLoc = null;

var gradients = ["gradient-1","gradient-2","gradient-3","gradient-4","gradient-5","gradient-6","gradient-7","gradient-8","gradient-9"];
var icons = ["⚖️","🎁","📋","🏠","💳","🏢","🌍","📊","🪪"];

// ===== INIT =====
function initApp() {
    populateAsisFilter();
    if (firebaseConfig.apiKey === "FIREBASE_API_KEY") {
        initLocal();
    } else {
        initFirebase();
    }
}

function initLocal() {
    setStatus("offline");
    loadLocal();
}

function initFirebase() {
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        db.ref(".info/connected").on("value", function(s) {
            if (s.val()) {
                setStatus("online");
                syncFirebase();
            } else {
                setStatus("connecting");
            }
        });
    } catch(e) {
        console.error(e);
        initLocal();
    }
}

function setStatus(s) {
    var dot = document.getElementById("statusDot");
    var txt = document.getElementById("connText");
    if (s === "online") {
        dot.className = "status-dot online";
        txt.textContent = "Connesso";
        isOnline = true;
    } else if (s === "offline") {
        dot.className = "status-dot offline";
        txt.textContent = "Locale";
        isOnline = false;
    } else {
        dot.className = "status-dot";
        txt.textContent = "Connessione...";
    }
}

function syncFirebase() {
    db.ref("cards").on("value", function(s) {
        var d = s.val();
        cardsData = d || JSON.parse(JSON.stringify(initialCards));
        renderCards();
        renderNavChips();
    });
    db.ref("structure").on("value", function(s) {
        var d = s.val();
        structureData = d || JSON.parse(JSON.stringify(initialStructure));
        renderMacros();
        renderNavChips();
    });
    if (currentUser) {
        var uid = "u_" + Date.now();
        var ref = db.ref("users/" + uid);
        ref.set({name: currentUser.name, t: firebase.database.ServerValue.TIMESTAMP});
        ref.onDisconnect().remove();
        db.ref("users").on("value", function(s) {
            var n = Object.keys(s.val() || {}).length;
            document.getElementById("usersOnline").textContent = n + " utent" + (n === 1 ? "e" : "i");
        });
    }
}

function loadLocal() {
    var c = localStorage.getItem("cs_cards_v5");
    var s = localStorage.getItem("cs_struct_v5");
    cardsData = c ? JSON.parse(c) : JSON.parse(JSON.stringify(initialCards));
    structureData = s ? JSON.parse(s) : JSON.parse(JSON.stringify(initialStructure));
    renderCards();
    renderMacros();
    renderNavChips();
}

function saveData() {
    if (db && isOnline) {
        db.ref("cards").set(cardsData);
        db.ref("structure").set(structureData);
    }
    localStorage.setItem("cs_cards_v5", JSON.stringify(cardsData));
    localStorage.setItem("cs_struct_v5", JSON.stringify(structureData));
}

// ===== USER =====
function enterSession() {
    var name = document.getElementById("usernameInput").value.trim();
    if (!name) {
        showToast("Inserisci un nome", "error");
        return;
    }
    currentUser = {name: name};
    document.getElementById("userModal").classList.remove("active");
    initApp();
}

// ===== FILTERS =====
function populateAsisFilter() {
    var sel = document.getElementById("asisFilter");
    for (var i = 0; i < asisList.length; i++) {
        var opt = document.createElement("option");
        opt.value = asisList[i];
        opt.textContent = asisList[i];
        sel.appendChild(opt);
    }
}

function setFilter(f) {
    currentFilter = f;
    var btns = document.querySelectorAll(".filter-btn");
    for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle("active", btns[i].getAttribute("data-f") === f);
    }
    renderCards();
}

// ===== NAV CHIPS =====
function renderNavChips() {
    var nav = document.getElementById("navBar");
    var chips = nav.querySelectorAll(".nav-chip");
    for (var i = 0; i < chips.length; i++) chips[i].remove();
    
    var actions = nav.querySelector(".nav-actions");
    for (var i = 0; i < structureData.macroAreas.length; i++) {
        var m = structureData.macroAreas[i];
        var cnt = countMacroCards(m.id);
        var chip = document.createElement("div");
        chip.className = "nav-chip chip-" + ((i % 9) + 1);
        chip.innerHTML = "<span>" + (m.icon || icons[i % icons.length]) + "</span><span>" + (m.name.length > 12 ? m.name.substring(0,12) + "..." : m.name) + "</span><span style='background:rgba(255,255,255,.3);padding:1px 5px;border-radius:8px;font-size:9px'>" + cnt + "</span>";
        chip.setAttribute("data-macro-id", m.id);
        chip.onclick = (function(id) { return function() { scrollToMacro(id); }; })(m.id);
        nav.insertBefore(chip, actions);
    }
}

function scrollToMacro(id) {
    var el = document.getElementById("macro-" + id);
    if (el) {
        el.classList.remove("collapsed");
        var y = el.getBoundingClientRect().top + window.scrollY - 100;
        window.scrollTo({top: y, behavior: "smooth"});
        el.style.boxShadow = "0 0 0 3px #3b82f6";
        setTimeout(function() { el.style.boxShadow = ""; }, 2000);
    }
}

function toggleAll(expand) {
    var macros = document.querySelectorAll(".macro-area");
    for (var i = 0; i < macros.length; i++) {
        if (expand) macros[i].classList.remove("collapsed");
        else macros[i].classList.add("collapsed");
    }
}

// ===== RENDER CARDS =====
function renderCards() {
    var container = document.getElementById("cardsContainer");
    var search = document.getElementById("searchBox").value.toLowerCase();
    var asisVal = document.getElementById("asisFilter").value;
    
    var keys = Object.keys(cardsData);
    var filtered = [];
    
    for (var i = 0; i < keys.length; i++) {
        var id = keys[i];
        var c = cardsData[id];
        var txt = (c.label + " " + (c.altLabel || "") + " " + id + " " + (c.originalMacro || "")).toLowerCase();
        if (search && txt.indexOf(search) === -1) continue;
        if (asisVal && c.asisCategory !== asisVal) continue;
        var done = c.locations && c.locations.length > 0;
        if (currentFilter === "done" && !done) continue;
        if (currentFilter === "todo" && done) continue;
        filtered.push({id: id, card: c, done: done});
    }
    
    filtered.sort(function(a, b) {
        if (a.done !== b.done) return a.done ? 1 : -1;
        return parseInt(a.id) - parseInt(b.id);
    });
    
    var total = keys.length;
    var doneCount = 0;
    for (var i = 0; i < keys.length; i++) {
        var c = cardsData[keys[i]];
        if (c.locations && c.locations.length > 0) doneCount++;
    }
    
    document.getElementById("cardCountNum").textContent = filtered.length + "/" + total;
    
    var html = '<div class="card-count">' + total + ' totali | ' + doneCount + ' assegnate | ' + (total - doneCount) + ' da fare</div>';
    
    for (var i = 0; i < filtered.length; i++) {
        var id = filtered[i].id;
        var c = filtered[i].card;
        var isDone = filtered[i].done;
        var isMulti = c.locations && c.locations.length > 1;
        
        html += '<div class="card-item ' + (isDone ? 'assigned ' : '') + (isMulti ? 'multi-assigned' : '') + '" draggable="true" data-card-id="' + id + '">';
        html += '<div class="card-header"><span class="card-id">ID ' + id + '</span>';
        html += '<div class="card-actions"><button class="dup-btn" data-dup="' + id + '" title="Duplica">+</button>';
        html += '<button class="edit-btn" data-edit="' + id + '" title="Modifica">✏️</button></div></div>';
        html += '<div class="card-label" data-edit="' + id + '">' + (c.altLabel || c.label) + '</div>';
        if (c.asisCategory) html += '<div class="card-asis">' + c.asisCategory + '</div>';
        if (c.url) html += '<a href="' + c.url + '" target="_blank" class="card-url">' + c.url.substring(0,40) + '...</a>';
        
        if (isDone) {
            html += '<div class="card-locations">';
            for (var j = 0; j < c.locations.length; j++) {
                var l = c.locations[j];
                var lbl = (l.sotto || l.macro || "").substring(0,15);
                html += '<span class="location-tag">' + lbl + '<span class="remove-loc" data-card="' + id + '" data-macro="' + l.macroId + '" data-sotto="' + l.sottoId + '" data-terzo="' + (l.terzoId || "") + '">&times;</span></span>';
            }
            html += '</div>';
        }
        html += '</div>';
    }
    
    container.innerHTML = html;
}

// ===== RENDER MACROS =====
function renderMacros() {
    var container = document.getElementById("macroContainer");
    var html = "";
    
    for (var i = 0; i < structureData.macroAreas.length; i++) {
        var m = structureData.macroAreas[i];
        var cnt = countMacroCards(m.id);
        
        html += '<div class="macro-area" id="macro-' + m.id + '" data-macro-id="' + m.id + '">';
        html += '<div class="macro-header ' + gradients[i % 9] + '" data-toggle="' + m.id + '">';
        html += '<div class="macro-title"><span class="macro-icon">' + (m.icon || icons[i % icons.length]) + '</span>';
        html += '<input type="text" class="macro-name-input" value="' + m.name + '" data-macro-name="' + m.id + '">';
        html += '<span class="macro-badge">' + cnt + '</span></div>';
        html += '<div class="macro-actions"><button data-toggle="' + m.id + '">▼</button>';
        html += '<button data-delete-macro="' + m.id + '">🗑️</button></div></div>';
        html += '<div class="macro-content">';
        
        var sottos = m.sottoCategorie || [];
        for (var j = 0; j < sottos.length; j++) {
            html += renderSotto(m.id, sottos[j]);
        }
        
        html += '<button class="add-btn" data-add-sotto="' + m.id + '">+ Sotto-categoria</button>';
        html += '</div></div>';
    }
    
    container.innerHTML = html;
}

function renderSotto(macroId, sotto) {
    var cards = getCardsInSotto(macroId, sotto.id);
    var html = '<div class="sotto-cat" data-macro-id="' + macroId + '" data-sotto-id="' + sotto.id + '">';
    html += '<div class="sotto-header"><input type="text" class="sotto-name-input" value="' + sotto.name + '" data-sotto-name="' + macroId + '|' + sotto.id + '">';
    html += '<div style="display:flex;gap:4px;align-items:center"><span class="sotto-count">' + cards.length + '</span>';
    html += '<button class="delete-btn" data-delete-sotto="' + macroId + '|' + sotto.id + '">🗑️</button></div></div>';
    html += '<div class="sotto-cards">';
    
    for (var i = 0; i < cards.length; i++) {
        html += renderSottoCard(cards[i], macroId, sotto.id, null, false);
    }
    if (cards.length === 0) html += '<span style="color:#94a3b8;font-size:9px">Trascina schede qui</span>';
    html += '</div>';
    
    if (sotto.terzoLivello && sotto.terzoLivello.length > 0) {
        html += '<div class="terzo-container">';
        for (var i = 0; i < sotto.terzoLivello.length; i++) {
            html += renderTerzo(macroId, sotto.id, sotto.terzoLivello[i]);
        }
        html += '</div>';
    }
    
    html += '<div style="padding:4px"><button class="add-btn" data-add-terzo="' + macroId + '|' + sotto.id + '" style="font-size:9px">+ 3° livello</button></div>';
    html += '</div>';
    return html;
}

function renderTerzo(macroId, sottoId, terzo) {
    var cards = getCardsInTerzo(macroId, sottoId, terzo.id);
    var html = '<div class="sotto-cat" data-macro-id="' + macroId + '" data-sotto-id="' + sottoId + '" data-terzo-id="' + terzo.id + '" style="margin:4px 0;background:#f1f5f9">';
    html += '<div class="sotto-header" style="padding:6px 8px"><input type="text" class="sotto-name-input" value="' + terzo.name + '" style="font-size:11px" data-terzo-name="' + macroId + '|' + sottoId + '|' + terzo.id + '">';
    html += '<div style="display:flex;gap:4px;align-items:center"><span class="sotto-count">' + cards.length + '</span>';
    html += '<button class="delete-btn" data-delete-terzo="' + macroId + '|' + sottoId + '|' + terzo.id + '">🗑️</button></div></div>';
    html += '<div class="sotto-cards">';
    for (var i = 0; i < cards.length; i++) {
        html += renderSottoCard(cards[i], macroId, sottoId, terzo.id, false);
    }
    if (cards.length === 0) html += '<span style="color:#94a3b8;font-size:8px">Trascina qui</span>';
    html += '</div></div>';
    return html;
}

function renderSottoCard(cardId, macroId, sottoId, terzoId, isChild) {
    var c = cardsData[cardId];
    if (!c) return "";
    var lbl = (c.altLabel || c.label).substring(0, 32);
    if ((c.altLabel || c.label).length > 32) lbl += "...";
    var hasChildren = c.children && c.children.length > 0;
    var html = '<div class="sotto-card' + (hasChildren ? ' is-group' : '') + '" draggable="true" data-card-id="' + cardId + '" data-from-macro="' + macroId + '" data-from-sotto="' + sottoId + '"';
    if (terzoId) html += ' data-from-terzo="' + terzoId + '"';
    if (isChild) html += ' data-is-child="true"';
    html += '>';
    // Header con ID, badge gruppo, pulsanti
    html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:2px">';
    html += '<span style="font-size:7px;color:#94a3b8">ID ' + cardId + '</span>';
    if (hasChildren) html += '<span class="group-badge">' + c.children.length + '</span>';
    html += '<span style="display:flex;gap:2px">';
    html += '<span class="dup-sotto-btn" data-dup-sotto="' + cardId + '" title="Duplica">+</span>';
    html += '<span class="edit-sotto-card" data-edit-sotto="' + cardId + '" title="Dettaglio">✏️</span>';
    html += '</span></div>';
    // Label
    html += '<div style="font-size:9px;color:#1e293b;line-height:1.2;margin-top:2px">' + lbl + '</div>';
    // Pulsante rimuovi (o sgancia se è child)
    if (isChild) {
        html += '<div class="remove-card" data-ungroup="' + cardId + '" title="Sgancia dal gruppo">&times;</div>';
    } else {
        html += '<div class="remove-card" data-remove-card="' + cardId + '|' + macroId + '|' + sottoId + '|' + (terzoId || '') + '">&times;</div>';
    }
    html += '</div>';
    // Render children se presenti
    if (hasChildren && !isChild) {
        html += '<div class="card-group">';
        for (var i = 0; i < c.children.length; i++) {
            html += renderSottoCard(c.children[i], macroId, sottoId, terzoId, true);
        }
        html += '</div>';
    }
    return html;
}

// ===== HELPERS =====
function getCardsInSotto(macroId, sottoId) {
    var result = [];
    var childIds = getAllChildIds();
    var keys = Object.keys(cardsData);
    for (var i = 0; i < keys.length; i++) {
        // Escludi card che sono children di altre
        if (childIds.indexOf(keys[i]) !== -1) continue;
        var c = cardsData[keys[i]];
        if (c.locations) {
            for (var j = 0; j < c.locations.length; j++) {
                var l = c.locations[j];
                if (l.macroId === macroId && l.sottoId === sottoId && !l.terzoId) {
                    result.push(keys[i]);
                    break;
                }
            }
        }
    }
    return result;
}

function getAllChildIds() {
    var children = [];
    var keys = Object.keys(cardsData);
    for (var i = 0; i < keys.length; i++) {
        var c = cardsData[keys[i]];
        if (c.children) {
            for (var j = 0; j < c.children.length; j++) {
                children.push(c.children[j]);
            }
        }
    }
    return children;
}

function getCardsInTerzo(macroId, sottoId, terzoId) {
    var result = [];
    var childIds = getAllChildIds();
    var keys = Object.keys(cardsData);
    for (var i = 0; i < keys.length; i++) {
        if (childIds.indexOf(keys[i]) !== -1) continue;
        var c = cardsData[keys[i]];
        if (c.locations) {
            for (var j = 0; j < c.locations.length; j++) {
                var l = c.locations[j];
                if (l.macroId === macroId && l.sottoId === sottoId && l.terzoId === terzoId) {
                    result.push(keys[i]);
                    break;
                }
            }
        }
    }
    return result;
}

function countMacroCards(macroId) {
    var count = 0;
    var keys = Object.keys(cardsData);
    for (var i = 0; i < keys.length; i++) {
        var c = cardsData[keys[i]];
        if (c.locations) {
            for (var j = 0; j < c.locations.length; j++) {
                if (c.locations[j].macroId === macroId) {
                    count++;
                    break;
                }
            }
        }
    }
    return count;
}

// ===== CARD OPERATIONS =====
function addCardToLoc(cardId, macroId, sottoId, terzoId) {
    if (!cardsData[cardId]) return;
    if (!cardsData[cardId].locations) cardsData[cardId].locations = [];
    
    for (var i = 0; i < cardsData[cardId].locations.length; i++) {
        var l = cardsData[cardId].locations[i];
        if (l.macroId === macroId && l.sottoId === sottoId && l.terzoId === terzoId) {
            showToast("Già presente", "info");
            return;
        }
    }
    
    var macro = null, sotto = null, terzo = null;
    for (var i = 0; i < structureData.macroAreas.length; i++) {
        if (structureData.macroAreas[i].id === macroId) {
            macro = structureData.macroAreas[i];
            var sottos = macro.sottoCategorie || [];
            for (var j = 0; j < sottos.length; j++) {
                if (sottos[j].id === sottoId) {
                    sotto = sottos[j];
                    if (terzoId && sotto.terzoLivello) {
                        for (var k = 0; k < sotto.terzoLivello.length; k++) {
                            if (sotto.terzoLivello[k].id === terzoId) {
                                terzo = sotto.terzoLivello[k];
                                break;
                            }
                        }
                    }
                    break;
                }
            }
            break;
        }
    }
    
    cardsData[cardId].locations.push({
        macroId: macroId,
        sottoId: sottoId,
        terzoId: terzoId,
        macro: macro ? macro.name : "",
        sotto: sotto ? sotto.name : "",
        terzo: terzo ? terzo.name : ""
    });
    cardsData[cardId].lastModifiedBy = currentUser ? currentUser.name : "";
    cardsData[cardId].lastModified = new Date().toISOString();
    
    saveData();
    renderAll();
    showToast("Aggiunta", "success");
}

function removeLoc(cardId, macroId, sottoId, terzoId) {
    if (!cardsData[cardId] || !cardsData[cardId].locations) return;
    
    cardsData[cardId].locations = cardsData[cardId].locations.filter(function(l) {
        if (terzoId) {
            return !(l.macroId === macroId && l.sottoId === sottoId && l.terzoId === terzoId);
        }
        return !(l.macroId === macroId && l.sottoId === sottoId && !l.terzoId);
    });
    
    // Rimuovi anche eventuali children
    if (cardsData[cardId].children) {
        cardsData[cardId].children = [];
    }
    
    saveData();
    renderAll();
    showToast("Rimossa", "info");
}

function groupCards(parentId, childId) {
    if (parentId === childId) return;
    if (!cardsData[parentId] || !cardsData[childId]) return;
    
    // Inizializza children se non esiste
    if (!cardsData[parentId].children) {
        cardsData[parentId].children = [];
    }
    
    // Evita duplicati
    if (cardsData[parentId].children.indexOf(childId) !== -1) {
        showToast("Già nel gruppo", "info");
        return;
    }
    
    // Rimuovi child da altri gruppi
    var keys = Object.keys(cardsData);
    for (var i = 0; i < keys.length; i++) {
        var c = cardsData[keys[i]];
        if (c.children) {
            var idx = c.children.indexOf(childId);
            if (idx !== -1) {
                c.children.splice(idx, 1);
            }
        }
    }
    
    // Rimuovi child dalle locations (sarà visibile sotto il parent)
    if (cardsData[childId].locations) {
        cardsData[childId].locations = [];
    }
    
    // Aggiungi al gruppo
    cardsData[parentId].children.push(childId);
    cardsData[parentId].lastModifiedBy = currentUser ? currentUser.name : "";
    cardsData[parentId].lastModified = new Date().toISOString();
    
    saveData();
    renderAll();
    showToast("Raggruppata sotto ID " + parentId, "success");
}

function ungroupCard(childId) {
    // Trova il parent
    var keys = Object.keys(cardsData);
    for (var i = 0; i < keys.length; i++) {
        var c = cardsData[keys[i]];
        if (c.children) {
            var idx = c.children.indexOf(childId);
            if (idx !== -1) {
                c.children.splice(idx, 1);
                
                // Copia le locations dal parent al child
                if (c.locations && c.locations.length > 0) {
                    cardsData[childId].locations = JSON.parse(JSON.stringify(c.locations));
                }
                
                saveData();
                renderAll();
                showToast("Sganciata dal gruppo", "info");
                return;
            }
        }
    }
}

function duplicateCard(cardId) {
    var orig = cardsData[cardId];
    if (!orig) return;
    var newId = "dup_" + cardId + "_" + Date.now();
    cardsData[newId] = JSON.parse(JSON.stringify(orig));
    cardsData[newId].label = orig.label + " (copia)";
    cardsData[newId].locations = [];
    cardsData[newId].lastModifiedBy = currentUser ? currentUser.name : "";
    cardsData[newId].lastModified = new Date().toISOString();
    saveData();
    renderAll();
    showToast("Duplicata: " + newId, "success");
}

// ===== CARD MODAL =====
function openCardModal(cardId) {
    selectedCardId = cardId;
    var c = cardsData[cardId];
    var html = '<div style="margin-bottom:10px"><label class="modal-label">ID</label><div style="font-weight:600">' + cardId + '</div></div>';
    html += '<div style="margin-bottom:10px"><label class="modal-label">Label originale</label><div style="font-size:12px">' + c.label + '</div></div>';
    if (c.asisCategory) html += '<div style="margin-bottom:10px"><label class="modal-label">Categoria ASIS</label><div style="background:#dbeafe;padding:4px 8px;border-radius:4px;font-size:11px;color:#1e40af;display:inline-block">' + c.asisCategory + '</div></div>';
    if (c.url) html += '<div style="margin-bottom:10px"><label class="modal-label">URL</label><a href="' + c.url + '" target="_blank" style="font-size:11px;color:#3b82f6">' + c.url + '</a></div>';
    html += '<div style="margin-bottom:10px"><label class="modal-label">Label alternativa</label><input type="text" id="inp_altLabel" class="modal-input" value="' + (c.altLabel || '') + '" placeholder="Nuova label..."></div>';
    html += '<div style="margin-bottom:10px"><label class="modal-label">Abstract (max 200)</label><textarea id="inp_abstract" class="modal-input" rows="2" maxlength="200">' + (c.abstract || '') + '</textarea></div>';
    html += '<div class="modal-row"><div style="flex:1"><label class="modal-label">Target</label><input type="text" id="inp_target" class="modal-input" value="' + (c.targetUser || '') + '"></div>';
    html += '<div style="flex:1"><label class="modal-label">User Need</label><input type="text" id="inp_need" class="modal-input" value="' + (c.userNeed || '') + '"></div></div>';
    html += '<div style="margin-bottom:10px"><label class="modal-label">Use Case</label><input type="text" id="inp_usecase" class="modal-input" value="' + (c.useCase || '') + '"></div>';
    html += '<div style="margin-bottom:10px"><label class="modal-label">Note</label><textarea id="inp_notes" class="modal-input" rows="2">' + (c.notes || '') + '</textarea></div>';
    if (c.lastModifiedBy) html += '<div style="font-size:9px;color:#94a3b8">Ultima modifica: ' + c.lastModifiedBy + '</div>';
    
    document.getElementById("cardModalContent").innerHTML = html;
    document.getElementById("cardModal").classList.add("active");
}

function closeCardModal() {
    document.getElementById("cardModal").classList.remove("active");
    selectedCardId = null;
}

function saveCardDetail() {
    if (!selectedCardId) return;
    var c = cardsData[selectedCardId];
    c.altLabel = document.getElementById("inp_altLabel").value.trim() || null;
    c.abstract = document.getElementById("inp_abstract").value.trim() || null;
    c.targetUser = document.getElementById("inp_target").value.trim() || null;
    c.userNeed = document.getElementById("inp_need").value.trim() || null;
    c.useCase = document.getElementById("inp_usecase").value.trim() || null;
    c.notes = document.getElementById("inp_notes").value.trim() || null;
    c.lastModifiedBy = currentUser ? currentUser.name : "";
    c.lastModified = new Date().toISOString();
    saveData();
    renderAll();
    closeCardModal();
    showToast("Salvata", "success");
}

// ===== STRUCTURE =====
function addMacroTop() {
    var newId = "macro_" + Date.now();
    structureData.macroAreas.unshift({
        id: newId,
        name: "Nuova Macro-area",
        icon: icons[0],
        sottoCategorie: [{id: "sotto_" + Date.now(), name: "Nuova sotto-categoria", terzoLivello: []}]
    });
    saveData();
    renderAll();
    showToast("Aggiunta in alto", "success");
    scrollToMacro(newId);
}

function addMacroBottom() {
    var newId = "macro_" + Date.now();
    var idx = structureData.macroAreas.length;
    structureData.macroAreas.push({
        id: newId,
        name: "Nuova Macro-area",
        icon: icons[idx % icons.length],
        sottoCategorie: [{id: "sotto_" + Date.now(), name: "Nuova sotto-categoria", terzoLivello: []}]
    });
    saveData();
    renderAll();
    showToast("Aggiunta", "success");
}

function deleteMacro(macroId) {
    showConfirm("Elimina macro-area?", "Le schede verranno rimosse.", function() {
        var keys = Object.keys(cardsData);
        for (var i = 0; i < keys.length; i++) {
            if (cardsData[keys[i]].locations) {
                cardsData[keys[i]].locations = cardsData[keys[i]].locations.filter(function(l) {
                    return l.macroId !== macroId;
                });
            }
        }
        structureData.macroAreas = structureData.macroAreas.filter(function(m) {
            return m.id !== macroId;
        });
        saveData();
        renderAll();
        showToast("Eliminata", "info");
    });
}

function updateMacroName(macroId, name) {
    for (var i = 0; i < structureData.macroAreas.length; i++) {
        if (structureData.macroAreas[i].id === macroId) {
            structureData.macroAreas[i].name = name;
            break;
        }
    }
    var keys = Object.keys(cardsData);
    for (var i = 0; i < keys.length; i++) {
        if (cardsData[keys[i]].locations) {
            for (var j = 0; j < cardsData[keys[i]].locations.length; j++) {
                if (cardsData[keys[i]].locations[j].macroId === macroId) {
                    cardsData[keys[i]].locations[j].macro = name;
                }
            }
        }
    }
    saveData();
    renderNavChips();
}

function addSotto(macroId) {
    for (var i = 0; i < structureData.macroAreas.length; i++) {
        if (structureData.macroAreas[i].id === macroId) {
            if (!structureData.macroAreas[i].sottoCategorie) structureData.macroAreas[i].sottoCategorie = [];
            structureData.macroAreas[i].sottoCategorie.push({id: "sotto_" + Date.now(), name: "Nuova sotto-categoria", terzoLivello: []});
            break;
        }
    }
    saveData();
    renderMacros();
    showToast("Aggiunta", "success");
}

function deleteSotto(macroId, sottoId) {
    showConfirm("Elimina sotto-categoria?", "", function() {
        for (var i = 0; i < structureData.macroAreas.length; i++) {
            if (structureData.macroAreas[i].id === macroId) {
                structureData.macroAreas[i].sottoCategorie = structureData.macroAreas[i].sottoCategorie.filter(function(s) {
                    return s.id !== sottoId;
                });
                break;
            }
        }
        var keys = Object.keys(cardsData);
        for (var i = 0; i < keys.length; i++) {
            if (cardsData[keys[i]].locations) {
                cardsData[keys[i]].locations = cardsData[keys[i]].locations.filter(function(l) {
                    return !(l.macroId === macroId && l.sottoId === sottoId);
                });
            }
        }
        saveData();
        renderAll();
        showToast("Eliminata", "info");
    });
}

function addTerzo(macroId, sottoId) {
    for (var i = 0; i < structureData.macroAreas.length; i++) {
        if (structureData.macroAreas[i].id === macroId) {
            var sottos = structureData.macroAreas[i].sottoCategorie || [];
            for (var j = 0; j < sottos.length; j++) {
                if (sottos[j].id === sottoId) {
                    if (!sottos[j].terzoLivello) sottos[j].terzoLivello = [];
                    sottos[j].terzoLivello.push({id: "terzo_" + Date.now(), name: "Nuovo 3° livello"});
                    break;
                }
            }
            break;
        }
    }
    saveData();
    renderMacros();
    showToast("Aggiunto", "success");
}

function deleteTerzo(macroId, sottoId, terzoId) {
    showConfirm("Elimina 3° livello?", "", function() {
        for (var i = 0; i < structureData.macroAreas.length; i++) {
            if (structureData.macroAreas[i].id === macroId) {
                var sottos = structureData.macroAreas[i].sottoCategorie || [];
                for (var j = 0; j < sottos.length; j++) {
                    if (sottos[j].id === sottoId && sottos[j].terzoLivello) {
                        sottos[j].terzoLivello = sottos[j].terzoLivello.filter(function(t) {
                            return t.id !== terzoId;
                        });
                        break;
                    }
                }
                break;
            }
        }
        var keys = Object.keys(cardsData);
        for (var i = 0; i < keys.length; i++) {
            if (cardsData[keys[i]].locations) {
                cardsData[keys[i]].locations = cardsData[keys[i]].locations.filter(function(l) {
                    return !(l.macroId === macroId && l.sottoId === sottoId && l.terzoId === terzoId);
                });
            }
        }
        saveData();
        renderAll();
        showToast("Eliminato", "info");
    });
}

// ===== SESSIONS =====
function openAdminModal() {
    renderSessionList();
    document.getElementById("adminModal").classList.add("active");
}

function closeAdminModal() {
    document.getElementById("adminModal").classList.remove("active");
}

function getSessions() {
    return JSON.parse(localStorage.getItem("cs_sessions") || "[]");
}

function saveSessions(sessions) {
    localStorage.setItem("cs_sessions", JSON.stringify(sessions));
}

function renderSessionList() {
    var sessions = getSessions();
    var list = document.getElementById("sessionList");
    if (sessions.length === 0) {
        list.innerHTML = '<div style="padding:20px;text-align:center;color:#94a3b8;font-size:11px">Nessuna sessione</div>';
        return;
    }
    var html = "";
    for (var i = 0; i < sessions.length; i++) {
        var s = sessions[i];
        html += '<div class="session-item"><div><div class="session-name">' + s.name + '</div>';
        html += '<div class="session-meta">' + new Date(s.date).toLocaleString("it-IT") + '</div></div>';
        html += '<div style="display:flex;gap:4px"><button class="btn btn-primary" data-load-session="' + i + '">Carica</button>';
        html += '<button class="btn btn-danger" data-delete-session="' + i + '">🗑️</button></div></div>';
    }
    list.innerHTML = html;
}

function saveSession() {
    var name = document.getElementById("sessionNameInput").value.trim();
    if (!name) {
        showToast("Inserisci un nome", "error");
        return;
    }
    var sessions = getSessions();
    sessions.push({
        name: name,
        date: new Date().toISOString(),
        cardCount: Object.keys(cardsData).length,
        cards: JSON.parse(JSON.stringify(cardsData)),
        structure: JSON.parse(JSON.stringify(structureData))
    });
    saveSessions(sessions);
    document.getElementById("sessionNameInput").value = "";
    renderSessionList();
    showToast("Sessione salvata", "success");
}

function loadSession(idx) {
    var sessions = getSessions();
    var s = sessions[idx];
    if (!s) return;
    showConfirm("Caricare " + s.name + "?", "I dati correnti verranno sostituiti.", function() {
        cardsData = s.cards;
        structureData = s.structure;
        saveData();
        renderAll();
        closeAdminModal();
        showToast("Sessione caricata", "success");
    });
}

function deleteSession(idx) {
    showConfirm("Eliminare sessione?", "", function() {
        var sessions = getSessions();
        sessions.splice(idx, 1);
        saveSessions(sessions);
        renderSessionList();
        showToast("Eliminata", "info");
    });
}

// ===== EXPORT/IMPORT =====
function exportSession() {
    var rows = [["ID","URL","Label Originale","Label Proposta","Categoria ASIS","Abstract","Target","User Need","Use Case","Nuova Macro","Nuova Sotto","3 Livello","Note","Modificato da","Data"]];
    var keys = Object.keys(cardsData);
    for (var i = 0; i < keys.length; i++) {
        var id = keys[i];
        var c = cardsData[id];
        if (c.locations && c.locations.length > 0) {
            for (var j = 0; j < c.locations.length; j++) {
                var l = c.locations[j];
                rows.push([id, c.url||"", c.label, c.altLabel||"", c.asisCategory||"", c.abstract||"", c.targetUser||"", c.userNeed||"", c.useCase||"", l.macro||"", l.sotto||"", l.terzo||"", c.notes||"", c.lastModifiedBy||"", c.lastModified ? new Date(c.lastModified).toLocaleString("it-IT") : ""]);
            }
        } else {
            rows.push([id, c.url||"", c.label, c.altLabel||"", c.asisCategory||"", c.abstract||"", c.targetUser||"", c.userNeed||"", c.useCase||"", "", "", "", c.notes||"", c.lastModifiedBy||"", c.lastModified ? new Date(c.lastModified).toLocaleString("it-IT") : ""]);
        }
    }
    var ws = XLSX.utils.aoa_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Card Sorting");
    XLSX.writeFile(wb, "CardSorting_" + new Date().toISOString().split("T")[0] + ".xlsx");
    showToast("Excel esportato", "success");
}

function importSession(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var wb = XLSX.read(e.target.result, {type: "binary"});
            var ws = wb.Sheets[wb.SheetNames[0]];
            var data = XLSX.utils.sheet_to_json(ws, {header: 1});
            var headers = data[0];
            var idIdx = headers.indexOf("ID");
            var altIdx = headers.indexOf("Label Proposta");
            var absIdx = headers.indexOf("Abstract");
            var targetIdx = headers.indexOf("Target");
            var needIdx = headers.indexOf("User Need");
            var useIdx = headers.indexOf("Use Case");
            var notesIdx = headers.indexOf("Note");
            var imported = 0;
            for (var i = 1; i < data.length; i++) {
                var row = data[i];
                var id = String(row[idIdx]);
                if (cardsData[id]) {
                    if (altIdx >= 0 && row[altIdx]) cardsData[id].altLabel = row[altIdx];
                    if (absIdx >= 0 && row[absIdx]) cardsData[id].abstract = row[absIdx];
                    if (targetIdx >= 0 && row[targetIdx]) cardsData[id].targetUser = row[targetIdx];
                    if (needIdx >= 0 && row[needIdx]) cardsData[id].userNeed = row[needIdx];
                    if (useIdx >= 0 && row[useIdx]) cardsData[id].useCase = row[useIdx];
                    if (notesIdx >= 0 && row[notesIdx]) cardsData[id].notes = row[notesIdx];
                    imported++;
                }
            }
            saveData();
            renderAll();
            showToast("Importate " + imported + " schede", "success");
        } catch(err) {
            showToast("Errore: " + err.message, "error");
        }
    };
    reader.readAsBinaryString(file);
}

// ===== DRAG & DROP =====
function handleDragStart(e) {
    var el = e.target.closest(".card-item, .sotto-card");
    if (!el) return;
    draggedCardId = el.getAttribute("data-card-id");
    if (el.classList.contains("sotto-card")) {
        draggedFromLoc = {
            macroId: el.getAttribute("data-from-macro"),
            sottoId: el.getAttribute("data-from-sotto"),
            terzoId: el.getAttribute("data-from-terzo") || null
        };
    } else {
        draggedFromLoc = null;
    }
    e.dataTransfer.setData("text/plain", draggedCardId);
    el.classList.add("dragging");
}

function handleDragEnd(e) {
    var el = e.target.closest(".card-item, .sotto-card");
    if (el) el.classList.remove("dragging");
    draggedCardId = null;
    draggedFromLoc = null;
}

function handleDragOver(e) {
    e.preventDefault();
    // Highlight card target for grouping
    var targetCard = e.target.closest(".sotto-card");
    if (targetCard && !targetCard.getAttribute("data-is-child")) {
        targetCard.classList.add("drag-over-card");
    }
    var target = e.target.closest(".sotto-cat, .cards-container");
    if (target) target.classList.add("drag-over");
}

function handleDragLeave(e) {
    var targetCard = e.target.closest(".sotto-card");
    if (targetCard) targetCard.classList.remove("drag-over-card");
    var target = e.target.closest(".sotto-cat, .cards-container");
    if (target) target.classList.remove("drag-over");
}

function handleDrop(e) {
    e.preventDefault();
    
    // Check if dropping on another card (for grouping)
    var targetCard = e.target.closest(".sotto-card");
    if (targetCard) {
        targetCard.classList.remove("drag-over-card");
        var targetCardId = targetCard.getAttribute("data-card-id");
        var cardId = e.dataTransfer.getData("text/plain");
        if (cardId && targetCardId && cardId !== targetCardId) {
            // Don't group if target is a child
            if (!targetCard.getAttribute("data-is-child")) {
                groupCards(targetCardId, cardId);
                return;
            }
        }
    }
    
    var target = e.target.closest(".sotto-cat, .cards-container");
    if (target) target.classList.remove("drag-over");
    
    var cardId = e.dataTransfer.getData("text/plain");
    if (!cardId) return;
    
    if (target && target.classList.contains("cards-container")) {
        // Drop to sidebar - remove from location
        if (draggedFromLoc) {
            removeLoc(cardId, draggedFromLoc.macroId, draggedFromLoc.sottoId, draggedFromLoc.terzoId);
        }
    } else if (target && target.classList.contains("sotto-cat")) {
        // Drop to category
        var macroId = target.getAttribute("data-macro-id");
        var sottoId = target.getAttribute("data-sotto-id");
        var terzoId = target.getAttribute("data-terzo-id") || null;
        
        if (draggedFromLoc) {
            // Remove from old location first
            if (cardsData[cardId] && cardsData[cardId].locations) {
                cardsData[cardId].locations = cardsData[cardId].locations.filter(function(l) {
                    if (draggedFromLoc.terzoId) {
                        return !(l.macroId === draggedFromLoc.macroId && l.sottoId === draggedFromLoc.sottoId && l.terzoId === draggedFromLoc.terzoId);
                    }
                    return !(l.macroId === draggedFromLoc.macroId && l.sottoId === draggedFromLoc.sottoId && !l.terzoId);
                });
            }
        }
        addCardToLoc(cardId, macroId, sottoId, terzoId);
    }
}

// ===== EVENT LISTENERS =====
document.addEventListener("DOMContentLoaded", function() {
    // User modal
    document.getElementById("enterBtn").onclick = enterSession;
    document.getElementById("usernameInput").onkeypress = function(e) {
        if (e.key === "Enter") enterSession();
    };
    
    // Card modal
    document.getElementById("closeCardBtn").onclick = closeCardModal;
    document.getElementById("saveCardBtn").onclick = saveCardDetail;
    
    // Admin modal
    document.getElementById("adminBtn").onclick = openAdminModal;
    document.getElementById("closeAdminBtn").onclick = closeAdminModal;
    document.getElementById("saveSessionBtn").onclick = saveSession;
    document.getElementById("exportBtn").onclick = exportSession;
    document.getElementById("exportBtnHeader").onclick = exportSession;
    document.getElementById("importFile").onchange = function(e) {
        if (e.target.files[0]) importSession(e.target.files[0]);
        e.target.value = "";
    };
    
    // Confirm dialog
    document.getElementById("cancelConfirmBtn").onclick = closeConfirm;
    document.getElementById("execConfirmBtn").onclick = execConfirm;
    
    // Nav buttons
    document.getElementById("expandAllBtn").onclick = function() { toggleAll(true); };
    document.getElementById("collapseAllBtn").onclick = function() { toggleAll(false); };
    document.getElementById("addMacroTopBtn").onclick = addMacroTop;
    document.getElementById("addMacroBottomBtn").onclick = addMacroBottom;
    
    // Filters
    document.getElementById("searchBox").oninput = renderCards;
    document.getElementById("asisFilter").onchange = renderCards;
    document.querySelectorAll(".filter-btn").forEach(function(btn) {
        btn.onclick = function() { setFilter(this.getAttribute("data-f")); };
    });
    
    // Delegated events
    document.addEventListener("click", function(e) {
        // Duplicate sotto-card button
        if (e.target.matches("[data-dup-sotto]")) {
            e.stopPropagation();
            duplicateCard(e.target.getAttribute("data-dup-sotto"));
            return;
        }
        // Ungroup button
        if (e.target.matches("[data-ungroup]")) {
            e.stopPropagation();
            ungroupCard(e.target.getAttribute("data-ungroup"));
            return;
        }
        // Edit sotto-card button
        if (e.target.matches("[data-edit-sotto]")) {
            e.stopPropagation();
            openCardModal(e.target.getAttribute("data-edit-sotto"));
            return;
        }
        // Duplicate button
        if (e.target.matches("[data-dup]")) {
            e.stopPropagation();
            duplicateCard(e.target.getAttribute("data-dup"));
            return;
        }
        // Edit button
        if (e.target.matches("[data-edit]")) {
            openCardModal(e.target.getAttribute("data-edit"));
            return;
        }
        // Remove location
        if (e.target.matches(".remove-loc")) {
            e.stopPropagation();
            var card = e.target.getAttribute("data-card");
            var macro = e.target.getAttribute("data-macro");
            var sotto = e.target.getAttribute("data-sotto");
            var terzo = e.target.getAttribute("data-terzo") || null;
            removeLoc(card, macro, sotto, terzo);
            return;
        }
        // Remove card from sotto
        if (e.target.matches("[data-remove-card]")) {
            e.stopPropagation();
            var parts = e.target.getAttribute("data-remove-card").split("|");
            removeLoc(parts[0], parts[1], parts[2], parts[3] || null);
            return;
        }
        // Toggle macro
        if (e.target.matches("[data-toggle]")) {
            var id = e.target.getAttribute("data-toggle");
            var el = document.getElementById("macro-" + id);
            if (el) el.classList.toggle("collapsed");
            return;
        }
        // Delete macro
        if (e.target.matches("[data-delete-macro]")) {
            e.stopPropagation();
            deleteMacro(e.target.getAttribute("data-delete-macro"));
            return;
        }
        // Add sotto
        if (e.target.matches("[data-add-sotto]")) {
            addSotto(e.target.getAttribute("data-add-sotto"));
            return;
        }
        // Delete sotto
        if (e.target.matches("[data-delete-sotto]")) {
            var parts = e.target.getAttribute("data-delete-sotto").split("|");
            deleteSotto(parts[0], parts[1]);
            return;
        }
        // Add terzo
        if (e.target.matches("[data-add-terzo]")) {
            var parts = e.target.getAttribute("data-add-terzo").split("|");
            addTerzo(parts[0], parts[1]);
            return;
        }
        // Delete terzo
        if (e.target.matches("[data-delete-terzo]")) {
            var parts = e.target.getAttribute("data-delete-terzo").split("|");
            deleteTerzo(parts[0], parts[1], parts[2]);
            return;
        }
        // Load session
        if (e.target.matches("[data-load-session]")) {
            loadSession(parseInt(e.target.getAttribute("data-load-session")));
            return;
        }
        // Delete session
        if (e.target.matches("[data-delete-session]")) {
            deleteSession(parseInt(e.target.getAttribute("data-delete-session")));
            return;
        }
    });
    
    // Input changes
    document.addEventListener("change", function(e) {
        if (e.target.matches("[data-macro-name]")) {
            updateMacroName(e.target.getAttribute("data-macro-name"), e.target.value);
        }
        if (e.target.matches("[data-sotto-name]")) {
            var parts = e.target.getAttribute("data-sotto-name").split("|");
            // updateSottoName would need to be implemented
        }
    });
    
    // Drag & drop
    document.addEventListener("dragstart", handleDragStart);
    document.addEventListener("dragend", handleDragEnd);
    document.addEventListener("dragover", handleDragOver);
    document.addEventListener("dragleave", handleDragLeave);
    document.addEventListener("drop", handleDrop);
    
    // Focus username input
    document.getElementById("usernameInput").focus();
});
</script>
