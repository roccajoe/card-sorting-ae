<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Sorting - Agenzia delle Entrate</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f5f5;font-size:14px}
.header{background:#1e3a5f;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header h1{font-size:18px}
.header-right{display:flex;gap:10px;align-items:center}
.status{display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:20px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#fbbf24}
.status-dot.online{background:#34d399}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500}
.btn-primary{background:#3b82f6;color:#fff}
.btn-success{background:#22c55e;color:#fff}
.btn-secondary{background:rgba(255,255,255,.2);color:#fff}

.main{display:flex;height:calc(100vh - 60px)}
.sidebar{width:380px;background:#fff;border-right:1px solid #e5e5e5;display:flex;flex-direction:column}
.sidebar-header{padding:16px;border-bottom:1px solid #e5e5e5;background:#fafafa}
.sidebar-header h2{font-size:15px;margin-bottom:12px}
.stats-row{display:flex;gap:8px;margin-bottom:12px}
.stat-box{flex:1;background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:8px;text-align:center}
.stat-box.active{background:#fef3c7;border-color:#f59e0b}
.stat-num{font-size:20px;font-weight:700}
.stat-label{font-size:10px;color:#666;text-transform:uppercase}
.search-row{display:flex;gap:8px}
.search-input{flex:1;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.filter-select{padding:10px;border:1px solid #ddd;border-radius:6px;font-size:12px;max-width:140px}
.filter-btns{display:flex;gap:4px;margin-top:10px}
.filter-btn{flex:1;padding:8px;font-size:11px;border:1px solid #ddd;background:#fff;border-radius:6px;cursor:pointer}
.filter-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.cards-list{flex:1;overflow-y:auto;padding:12px}

.card-item{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:12px;margin-bottom:8px;cursor:grab}
.card-item:hover{border-color:#3b82f6;box-shadow:0 2px 8px rgba(59,130,246,.1)}
.card-item.assigned{border-left:3px solid #22c55e}
.card-item.dragging{opacity:.4}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.card-id{font-size:10px;color:#888;background:#f5f5f5;padding:2px 6px;border-radius:4px}
.card-menu-btn{background:none;border:none;font-size:16px;cursor:pointer;color:#888;padding:4px}
.card-label{font-size:13px;font-weight:500;color:#333;cursor:pointer}
.card-label:hover{color:#3b82f6}
.card-asis{font-size:11px;color:#1e40af;background:#dbeafe;padding:3px 8px;border-radius:4px;display:inline-block;margin-top:6px}
.card-locs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.loc-tag{font-size:10px;background:#dcfce7;color:#166534;padding:3px 8px;border-radius:4px;display:flex;align-items:center;gap:4px}
.loc-tag .remove{cursor:pointer;font-weight:700}

.board{flex:1;overflow-y:auto;padding:20px;background:#f0f0f0}
.board-header{display:flex;gap:8px;margin-bottom:16px}
.board-header button{padding:8px 12px;font-size:12px;background:#fff;border:1px solid #ddd;border-radius:6px;cursor:pointer}

.macro-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;align-items:start}
@media(max-width:1200px){.macro-grid{grid-template-columns:1fr}}

.macro-area{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);overflow:hidden}
.macro-header{padding:14px 16px;color:#fff;display:flex;align-items:center;gap:10px;cursor:pointer}
.macro-header:hover{filter:brightness(1.1)}
.toggle-icon{font-size:14px;transition:transform .2s}
.macro-area.closed .toggle-icon{transform:rotate(-90deg)}
.macro-area.closed .macro-body{display:none}
.macro-info{flex:1;min-width:0}
.macro-name{font-size:14px;font-weight:600}
.macro-badge{font-size:11px;background:rgba(255,255,255,.25);padding:3px 10px;border-radius:10px;margin-left:8px}
.macro-del{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;opacity:0;transition:opacity .2s}
.macro-header:hover .macro-del{opacity:1}
.macro-body{padding:12px}

.sotto-cat{background:#f8f8f8;border:2px dashed #ddd;border-radius:8px;margin-bottom:10px}
.sotto-cat.drag-over{border-color:#3b82f6;background:#eff6ff}
.sotto-header{padding:10px 12px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:6px 6px 0 0;cursor:pointer}
.sotto-header:hover{background:#f5f5f5}
.sotto-toggle{font-size:12px;color:#666;transition:transform .2s}
.sotto-cat.closed .sotto-toggle{transform:rotate(-90deg)}
.sotto-cat.closed .sotto-cards{display:none}
.sotto-name{flex:1;font-size:13px;font-weight:600}
.sotto-count{font-size:11px;background:#e5e5e5;padding:2px 8px;border-radius:10px;color:#666}
.sotto-del{background:#fee2e2;border:none;color:#dc2626;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;opacity:0}
.sotto-header:hover .sotto-del{opacity:1}
.sotto-cards{padding:10px;display:flex;flex-wrap:wrap;gap:6px;min-height:50px}

.sotto-card{background:#fff;border:1px solid #e5e5e5;border-radius:6px;padding:10px;width:180px;cursor:pointer;position:relative}
.sotto-card:hover{border-color:#3b82f6}
.sotto-card.drag-over-group{border:2px solid #8b5cf6;background:#f5f3ff}
.sotto-card .card-id{font-size:9px}
.sotto-card .card-label{font-size:12px;margin-top:4px}
.sotto-card-menu{position:absolute;top:6px;right:6px;background:none;border:none;font-size:14px;cursor:pointer;color:#888;opacity:0}
.sotto-card:hover .sotto-card-menu{opacity:1}

.add-btn{width:100%;padding:10px;border:2px dashed #ccc;background:transparent;border-radius:6px;color:#888;cursor:pointer;font-size:12px;margin-top:8px}
.add-btn:hover{border-color:#3b82f6;color:#3b82f6}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:500px;max-width:95%;max-height:90vh;overflow-y:auto}
.modal h3{margin-bottom:16px;font-size:16px}
.modal-field{margin-bottom:14px}
.modal-field label{display:block;font-size:11px;color:#666;margin-bottom:4px;text-transform:uppercase}
.modal-field input,.modal-field textarea,.modal-field select{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:13px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #eee}

.dropdown{position:fixed;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.15);display:none;min-width:140px;z-index:100}
.dropdown.show{display:block}
.dropdown button{display:block;width:100%;padding:10px 14px;border:none;background:none;text-align:left;cursor:pointer;font-size:13px}
.dropdown button:hover{background:#f5f5f5}
.dropdown button.danger{color:#dc2626}

.toast-box{position:fixed;bottom:20px;right:20px;z-index:2000}
.toast{background:#333;color:#fff;padding:12px 20px;border-radius:8px;margin-top:8px;font-size:13px}
.toast.success{background:#22c55e}
.toast.error{background:#ef4444}

.g1{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.g2{background:linear-gradient(135deg,#f43f5e,#fb7185)}
.g3{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}
.g4{background:linear-gradient(135deg,#22c55e,#4ade80)}
.g5{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.g6{background:linear-gradient(135deg,#ec4899,#f472b6)}
.g7{background:linear-gradient(135deg,#14b8a6,#2dd4bf)}
.g8{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
.g9{background:linear-gradient(135deg,#0891b2,#22d3ee)}
.g10{background:linear-gradient(135deg,#84cc16,#a3e635)}
.g11{background:linear-gradient(135deg,#f97316,#fb923c)}
.g12{background:linear-gradient(135deg,#06b6d4,#67e8f9)}
</style>
</head>
<body>

<div class="modal-bg show" id="loginModal">
<div class="modal" style="text-align:center">
<h3>Card Sorting - Agenzia delle Entrate</h3>
<p style="color:#666;margin-bottom:16px">Inserisci il tuo nome per iniziare</p>
<input type="text" id="userName" placeholder="Il tuo nome..." style="text-align:center">
<div class="modal-actions" style="justify-content:center">
<button class="btn btn-primary" id="loginBtn">Entra</button>
</div>
</div>
</div>

<div class="modal-bg" id="cardModal">
<div class="modal">
<h3>Dettaglio Scheda</h3>
<div id="cardModalBody"></div>
<div class="modal-actions">
<button class="btn" style="background:#eee" id="closeCardBtn">Chiudi</button>
<button class="btn btn-primary" id="saveCardBtn">Salva</button>
</div>
</div>
</div>

<div class="modal-bg" id="adminModal">
<div class="modal" style="width:600px">
<h3>Gestione Sessioni</h3>
<div class="modal-field">
<label>Salva sessione</label>
<div style="display:flex;gap:8px">
<input type="text" id="sessionName" placeholder="Nome sessione...">
<button class="btn btn-primary" id="saveSessionBtn">Salva</button>
</div>
</div>
<div class="modal-field">
<label>Sessioni salvate</label>
<div id="sessionsList" style="max-height:200px;overflow-y:auto;border:1px solid #ddd;border-radius:6px"></div>
</div>
<div style="display:flex;gap:8px;margin-top:16px">
<button class="btn btn-success" id="exportBtn">Esporta Excel</button>
<label class="btn" style="background:#eee;cursor:pointer">Importa Excel<input type="file" accept=".xlsx" id="importInput" style="display:none"></label>
</div>
<div class="modal-actions">
<button class="btn" style="background:#eee" id="closeAdminBtn">Chiudi</button>
</div>
</div>
</div>

<div class="modal-bg" id="confirmModal">
<div class="modal" style="width:400px;text-align:center">
<h3 id="confirmTitle">Conferma</h3>
<p id="confirmMsg" style="color:#666;margin-bottom:16px"></p>
<div class="modal-actions" style="justify-content:center">
<button class="btn" style="background:#eee" id="confirmNo">Annulla</button>
<button class="btn" style="background:#ef4444;color:#fff" id="confirmYes">Conferma</button>
</div>
</div>
</div>

<div class="header">
<h1>Card Sorting - Agenzia delle Entrate</h1>
<div class="header-right">
<div class="status"><span class="status-dot" id="statusDot"></span><span id="statusText">Connessione...</span></div>
<span id="usersCount" style="font-size:12px">1 utente</span>
<button class="btn btn-secondary" id="adminOpenBtn">Sessioni</button>
<button class="btn btn-success" id="exportHeaderBtn">Excel</button>
<button class="btn" id="viewArchBtn" style="background:#8b5cf6;color:#fff">🏛️ Vedi Architettura</button>
</div>
</div>

<div class="main">
<div class="sidebar">
<div class="sidebar-header">
<h2>Schede</h2>
<div class="stats-row">
<div class="stat-box active"><div class="stat-num" id="statTodo">0</div><div class="stat-label">Da fare</div></div>
<div class="stat-box"><div class="stat-num" id="statDone">0</div><div class="stat-label">Fatte</div></div>
<div class="stat-box"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Totali</div></div>
</div>
<div class="search-row">
<input type="text" class="search-input" id="searchInput" placeholder="Cerca...">
<select class="filter-select" id="asisFilter"><option value="">Tutte</option></select>
</div>
<div class="filter-btns">
<button class="filter-btn active" data-filter="todo">Da fare</button>
<button class="filter-btn" data-filter="done">Fatte</button>
<button class="filter-btn" data-filter="all">Tutte</button>
</div>
</div>
<div class="cards-list" id="cardsList"></div>
</div>

<div class="board">
<div class="board-header">
<button id="expandAllBtn">Espandi tutto</button>
<button id="collapseAllBtn">Chiudi tutto</button>
<button id="addMacroBtn" style="background:#22c55e;color:#fff;border-color:#22c55e">+ Macro-area</button>
</div>
<div class="macro-grid" id="macroGrid"></div>
</div>
</div>

<div class="dropdown" id="cardMenu"></div>
<div class="toast-box" id="toastBox"></div>

// ===== INIT =====
function init() {
    populateAsis();
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        db.ref(".info/connected").on("value", function(s) {
            if (s.val()) { setOnline(true); syncData(); }
            else { setOnline(false); }
        });
    } catch(e) {
        setOnline(false);
        loadLocal();
    }
}

function setOnline(v) {
    online = v;
    document.getElementById("statusDot").className = "status-dot " + (v ? "online" : "");
    document.getElementById("statusText").textContent = v ? "Connesso" : "Offline";
}

function syncData() {
    db.ref("cards").on("value", function(s) {
        cards = s.val() || JSON.parse(JSON.stringify(initialCards));
        renderAll();
    });
    db.ref("structure").on("value", function(s) {
        structure = s.val() || JSON.parse(JSON.stringify(initialStructure));
        renderAll();
    });
}

function loadLocal() {
    var c = localStorage.getItem("cs_cards");
    var s = localStorage.getItem("cs_struct");
    cards = c ? JSON.parse(c) : JSON.parse(JSON.stringify(initialCards));
    structure = s ? JSON.parse(s) : JSON.parse(JSON.stringify(initialStructure));
    renderAll();
}

function saveData() {
    if (db && online) {
        db.ref("cards").set(cards);
        db.ref("structure").set(structure);
    }
    localStorage.setItem("cs_cards", JSON.stringify(cards));
    localStorage.setItem("cs_struct", JSON.stringify(structure));
}

function populateAsis() {
    var sel = document.getElementById("asisFilter");
    for (var i = 0; i < asisList.length; i++) {
        var o = document.createElement("option");
        o.value = asisList[i];
        o.textContent = asisList[i];
        sel.appendChild(o);
    }
}

// ===== HELPERS =====
function isAssigned(id) {
    var c = cards[id];
    if (!c) return false;
    for (var k in cards) {
        if (cards[k].children && cards[k].children.indexOf(id) !== -1) return true;
    }
    return c.locations && c.locations.length > 0;
}

function getCardsIn(macroId, sottoId) {
    var result = [];
    var childIds = [];
    for (var k in cards) {
        if (cards[k].children) childIds = childIds.concat(cards[k].children);
    }
    for (var k in cards) {
        if (childIds.indexOf(k) !== -1) continue;
        var c = cards[k];
        if (!c.locations) continue;
        for (var i = 0; i < c.locations.length; i++) {
            var l = c.locations[i];
            if (l.macroId === macroId && l.sottoId === sottoId) {
                result.push(k);
                break;
            }
        }
    }
    return result;
}

function countMacro(macroId) {
    var n = 0;
    for (var k in cards) {
        var c = cards[k];
        if (!c.locations) continue;
        for (var i = 0; i < c.locations.length; i++) {
            if (c.locations[i].macroId === macroId) { n++; break; }
        }
    }
    return n;
}

// ===== RENDER =====
function renderAll() {
    renderCards();
    renderMacros();
}

function renderCards() {
    var search = document.getElementById("searchInput").value.toLowerCase();
    var asis = document.getElementById("asisFilter").value;
    var list = document.getElementById("cardsList");
    var html = "";
    var todo = 0, done = 0, total = 0;
    
    var keys = Object.keys(cards).sort(function(a,b) { return parseInt(a) - parseInt(b); });
    
    for (var i = 0; i < keys.length; i++) {
        var id = keys[i];
        var c = cards[id];
        if (c.contentType === "Servizio/Modello/Strumento") continue;
        
        total++;
        var assigned = isAssigned(id);
        if (assigned) done++; else todo++;
        
        var txt = (c.label + " " + (c.altLabel || "") + " " + id).toLowerCase();
        if (search && txt.indexOf(search) === -1) continue;
        if (asis && c.asisCategory !== asis) continue;
        if (filter === "todo" && assigned) continue;
        if (filter === "done" && !assigned) continue;
        
        html += '<div class="card-item ' + (assigned ? 'assigned' : '') + '" draggable="true" data-id="' + id + '">';
        html += '<div class="card-top"><span class="card-id">ID ' + id + '</span>';
        html += '<button class="card-menu-btn" data-menu="' + id + '">&#8942;</button></div>';
        html += '<div class="card-label" data-open="' + id + '">' + (c.altLabel || c.label) + '</div>';
        if (c.asisCategory) html += '<div class="card-asis">' + c.asisCategory + '</div>';
        if (c.locations && c.locations.length > 0) {
            html += '<div class="card-locs">';
            for (var j = 0; j < c.locations.length; j++) {
                var l = c.locations[j];
                html += '<span class="loc-tag">' + (l.sotto || "").substring(0,15) + '<span class="remove" data-remove="' + id + '|' + l.macroId + '|' + l.sottoId + '">&times;</span></span>';
            }
            html += '</div>';
        }
        html += '</div>';
    }
    
    if (!html) html = '<div style="text-align:center;padding:40px;color:#888">Nessuna scheda</div>';
    list.innerHTML = html;
    
    document.getElementById("statTodo").textContent = todo;
    document.getElementById("statDone").textContent = done;
    document.getElementById("statTotal").textContent = total;
}

function renderMacros() {
    var grid = document.getElementById("macroGrid");
    var html = "";
    
    for (var i = 0; i < structure.macroAreas.length; i++) {
        var m = structure.macroAreas[i];
        var cnt = countMacro(m.id);
        
        html += '<div class="macro-area" id="macro-' + m.id + '" data-macro="' + m.id + '">';
        html += '<div class="macro-header ' + gradients[i % 12] + '" data-toggle-macro="' + m.id + '">';
        html += '<span class="toggle-icon">&#9660;</span>';
        html += '<div class="macro-info">';
        html += '<span class="macro-name" data-edit-macro="' + m.id + '">' + m.name + '</span>';
        html += '<span class="macro-badge">' + cnt + '</span>';
        html += '</div>';
        html += '<button class="macro-del" data-del-macro="' + m.id + '">&#128465;</button>';
        html += '</div>';
        html += '<div class="macro-body">';
        
        var sottos = m.sottoCategorie || [];
        for (var j = 0; j < sottos.length; j++) {
            html += renderSotto(m.id, sottos[j]);
        }
        
        html += '<button class="add-btn" data-add-sotto="' + m.id + '">+ Sotto-categoria</button>';
        html += '</div></div>';
    }
    
    grid.innerHTML = html;
}

function renderSotto(macroId, sotto) {
    var cardIds = getCardsIn(macroId, sotto.id);
    var html = '<div class="sotto-cat" data-drop-macro="' + macroId + '" data-drop-sotto="' + sotto.id + '">';
    html += '<div class="sotto-header" data-toggle-sotto>';
    html += '<span class="sotto-toggle">&#9660;</span>';
    html += '<span class="sotto-name" data-edit-sotto="' + macroId + '|' + sotto.id + '">' + sotto.name + '</span>';
    html += '<span class="sotto-count">' + cardIds.length + '</span>';
    html += '<button class="sotto-del" data-del-sotto="' + macroId + '|' + sotto.id + '">&#128465;</button>';
    html += '</div>';
    html += '<div class="sotto-cards">';
    
    for (var i = 0; i < cardIds.length; i++) {
        html += renderSottoCard(cardIds[i], macroId, sotto.id);
    }
    if (cardIds.length === 0) html += '<span style="color:#aaa;font-size:12px">Trascina qui</span>';
    
    html += '</div></div>';
    return html;
}

function renderSottoCard(id, macroId, sottoId) {
    var c = cards[id];
    if (!c) return "";
    var lbl = (c.altLabel || c.label);
    if (lbl.length > 35) lbl = lbl.substring(0,35) + "...";
    
    var html = '<div class="sotto-card" draggable="true" data-id="' + id + '" data-from-macro="' + macroId + '" data-from-sotto="' + sottoId + '">';
    html += '<span class="card-id">ID ' + id + '</span>';
    html += '<button class="sotto-card-menu" data-menu="' + id + '|' + macroId + '|' + sottoId + '">&#8942;</button>';
    html += '<div class="card-label" data-open="' + id + '">' + lbl + '</div>';
    
    if (c.children && c.children.length > 0) {
        html += '<div style="margin-top:8px;padding-left:8px;border-left:2px dashed #c4b5fd">';
        for (var i = 0; i < c.children.length; i++) {
            var ch = cards[c.children[i]];
            if (ch) {
                var chLbl = (ch.altLabel || ch.label);
                if (chLbl.length > 30) chLbl = chLbl.substring(0,30) + "...";
                html += '<div style="font-size:11px;color:#666;padding:4px 0">' + chLbl + '</div>';
            }
        }
        html += '</div>';
    }
    
    html += '</div>';
    return html;
}

// ===== IMPORT EXCEL =====
function importExcel(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var wb = XLSX.read(e.target.result, {type: "binary"});
            var ws = wb.Sheets[wb.SheetNames[0]];
            var data = XLSX.utils.sheet_to_json(ws, {header: 1});
            
            // RESET: Ricostruisci tutto da zero dall'Excel
            var newCards = {};
            var newStructure = {macroAreas: []};
            var macrosMap = {};  // {macro_name: {id, sottos: {sotto_name: id}}}
            
            var imported = 0, excluded = 0, positioned = 0, duplicated = 0;
            
            // Prima passa: raccogli tutte le macro-aree e sotto-categorie
            for (var i = 1; i < data.length; i++) {
                var row = data[i];
                if (!row || !row[0]) continue;
                
                var tipo = row[6] ? String(row[6]).trim() : "";
                if (tipo === "Servizio/Modello/Strumento") continue;
                
                var macro1 = row[8] ? String(row[8]).trim() : "";
                var macro2 = row[9] ? String(row[9]).trim() : "";
                var sotto1 = row[10] ? String(row[10]).trim() : "";
                var sotto2 = row[11] ? String(row[11]).trim() : "";
                
                // Macro 1
                if (macro1) {
                    if (!macrosMap[macro1]) macrosMap[macro1] = {sottos: {}};
                    var s1 = sotto1 || "Generale";
                    macrosMap[macro1].sottos[s1] = true;
                }
                
                // Macro 2
                if (macro2) {
                    if (!macrosMap[macro2]) macrosMap[macro2] = {sottos: {}};
                    var s2 = sotto2 || "Generale";
                    macrosMap[macro2].sottos[s2] = true;
                }
            }
            
            // Crea struttura
            var macroNames = Object.keys(macrosMap).sort();
            for (var mi = 0; mi < macroNames.length; mi++) {
                var mName = macroNames[mi];
                var mId = "macro_" + (mi + 1);
                macrosMap[mName].id = mId;
                
                var sottoNames = Object.keys(macrosMap[mName].sottos).sort();
                var sottoList = [];
                for (var si = 0; si < sottoNames.length; si++) {
                    var sName = sottoNames[si];
                    var sId = "sotto_" + (mi + 1) + "_" + (si + 1);
                    macrosMap[mName].sottos[sName] = sId;
                    sottoList.push({id: sId, name: sName, terzoLivello: []});
                }
                
                newStructure.macroAreas.push({
                    id: mId,
                    name: mName,
                    icon: icons[mi % icons.length],
                    sottoCategorie: sottoList
                });
            }
            
            // Seconda passa: crea cards con locations
            for (var i = 1; i < data.length; i++) {
                var row = data[i];
                if (!row || !row[0]) continue;
                
                var id = String(row[0]).trim();
                var tipo = row[6] ? String(row[6]).trim() : "";
                
                if (tipo === "Servizio/Modello/Strumento") {
                    excluded++;
                    continue;
                }
                
                var url = row[2] ? String(row[2]) : "";
                var asisCategory = row[3] ? String(row[3]) : "";
                var label = row[4] ? String(row[4]) : "Scheda " + id;
                var action = row[7] ? String(row[7]) : "";
                var macro1 = row[8] ? String(row[8]).trim() : "";
                var macro2 = row[9] ? String(row[9]).trim() : "";
                var sotto1 = row[10] ? String(row[10]).trim() : "";
                var sotto2 = row[11] ? String(row[11]).trim() : "";
                var lifeEvent = row[12] ? String(row[12]) : "";
                var abstract = row[13] ? String(row[13]) : "";
                
                var locations = [];
                
                // Posizione 1: I + K
                if (macro1 && macrosMap[macro1]) {
                    var s1 = sotto1 || "Generale";
                    if (macrosMap[macro1].sottos[s1]) {
                        locations.push({
                            macroId: macrosMap[macro1].id,
                            sottoId: macrosMap[macro1].sottos[s1],
                            macro: macro1,
                            sotto: s1
                        });
                        positioned++;
                    }
                }
                
                // Posizione 2: J + L (duplica)
                if (macro2 && macrosMap[macro2]) {
                    var s2 = sotto2 || "Generale";
                    if (macrosMap[macro2].sottos[s2]) {
                        // Evita duplicati esatti
                        var isDup = false;
                        for (var x = 0; x < locations.length; x++) {
                            if (locations[x].macroId === macrosMap[macro2].id && 
                                locations[x].sottoId === macrosMap[macro2].sottos[s2]) {
                                isDup = true;
                                break;
                            }
                        }
                        if (!isDup) {
                            locations.push({
                                macroId: macrosMap[macro2].id,
                                sottoId: macrosMap[macro2].sottos[s2],
                                macro: macro2,
                                sotto: s2
                            });
                            duplicated++;
                        }
                    }
                }
                
                newCards[id] = {
                    label: label,
                    url: url,
                    asisCategory: asisCategory,
                    altLabel: action || null,
                    abstract: abstract || null,
                    useCase: lifeEvent || null,
                    contentType: tipo || null,
                    locations: locations,
                    children: [],
                    lastModifiedBy: user ? user.name : "Import",
                    lastModified: new Date().toISOString()
                };
                
                imported++;
            }
            
            // Sostituisci tutto
            cards = newCards;
            structure = newStructure;
            
            saveData();
            renderAll();
            document.getElementById("adminModal").classList.remove("show");
            toast("Importate " + imported + " schede, " + positioned + " posizionate, " + duplicated + " doppie, " + excluded + " escluse. " + newStructure.macroAreas.length + " macro-aree.", "success");
            
        } catch(err) {
            console.error(err);
            toast("Errore: " + err.message, "error");
        }
    };
    reader.readAsBinaryString(file);
}

function exportExcel() {
    var rows = [["ID","URL","Label Originale","Label Proposta","Categoria AS-IS","Abstract","Use Case","Nuova Macro","Nuova Sotto","Nuova Macro #2","Nuova Sotto #2","Note","Modificato da"]];
    
    for (var k in cards) {
        var c = cards[k];
        if (c.contentType === "Servizio/Modello/Strumento") continue;
        
        var loc1 = c.locations && c.locations[0] ? c.locations[0] : null;
        var loc2 = c.locations && c.locations[1] ? c.locations[1] : null;
        
        rows.push([
            k, 
            c.url||"", 
            c.label, 
            c.altLabel||"", 
            c.asisCategory||"", 
            c.abstract||"", 
            c.useCase||"",
            loc1 ? loc1.macro : "",
            loc1 ? loc1.sotto : "",
            loc2 ? loc2.macro : "",
            loc2 ? loc2.sotto : "",
            c.notes||"", 
            c.lastModifiedBy||""
        ]);
    }
    
    var ws = XLSX.utils.aoa_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Card Sorting");
    XLSX.writeFile(wb, "CardSorting_" + new Date().toISOString().split("T")[0] + ".xlsx");
    toast("Esportato", "success");
}

// ===== SESSIONS =====
function getSessions() { return JSON.parse(localStorage.getItem("cs_sessions") || "[]"); }

function renderSessions() {
    var list = document.getElementById("sessionsList");
    var sessions = getSessions();
    if (sessions.length === 0) {
        list.innerHTML = '<div style="padding:20px;text-align:center;color:#888">Nessuna sessione</div>';
        return;
    }
    var html = "";
    for (var i = 0; i < sessions.length; i++) {
        var s = sessions[i];
        html += '<div style="padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center" data-session="' + i + '">';
        html += '<div><strong>' + s.name + '</strong><br><small style="color:#888">' + new Date(s.date).toLocaleString("it-IT") + '</small></div>';
        html += '<div><button class="btn btn-primary" data-load-session="' + i + '">Carica</button> <button class="btn" style="background:#ef4444;color:#fff" data-del-session="' + i + '">&#128465;</button></div>';
        html += '</div>';
    }
    list.innerHTML = html;
}

// ===== CARD MODAL =====
function openCard(id) {
    selectedCard = id;
    var c = cards[id];
    
    var html = '<div class="modal-field"><label>ID</label><div>' + id + '</div></div>';
    html += '<div class="modal-field"><label>Nome originale</label><div>' + c.label + '</div></div>';
    if (c.asisCategory) html += '<div class="modal-field"><label>Categoria AS-IS</label><div style="color:#1e40af">' + c.asisCategory + '</div></div>';
    if (c.url) html += '<div class="modal-field"><label>URL</label><div><a href="' + c.url + '" target="_blank" style="color:#3b82f6">' + c.url + '</a></div></div>';
    
    html += '<div class="modal-field"><label>Label alternativa</label><input id="inp_alt" value="' + (c.altLabel || "").replace(/"/g, "&quot;") + '"></div>';
    html += '<div class="modal-field"><label>Abstract</label><textarea id="inp_abs" rows="2">' + (c.abstract || "") + '</textarea></div>';
    html += '<div class="modal-field"><label>Note</label><textarea id="inp_note" rows="2">' + (c.notes || "") + '</textarea></div>';
    
    if (c.locations && c.locations.length > 0) {
        html += '<div class="modal-field"><label>Posizionamenti</label><div>';
        for (var i = 0; i < c.locations.length; i++) {
            html += '<div style="background:#dcfce7;padding:4px 8px;border-radius:4px;margin:2px 0;font-size:12px">' + c.locations[i].macro + ' &rarr; ' + c.locations[i].sotto + '</div>';
        }
        html += '</div></div>';
    }
    
    document.getElementById("cardModalBody").innerHTML = html;
    document.getElementById("cardModal").classList.add("show");
}

function saveCard() {
    if (!selectedCard) return;
    var c = cards[selectedCard];
    c.altLabel = document.getElementById("inp_alt").value.trim() || null;
    c.abstract = document.getElementById("inp_abs").value.trim() || null;
    c.notes = document.getElementById("inp_note").value.trim() || null;
    c.lastModifiedBy = user ? user.name : "";
    c.lastModified = new Date().toISOString();
    saveData();
    renderAll();
    document.getElementById("cardModal").classList.remove("show");
    selectedCard = null;
    toast("Salvato", "success");
}

function addSotto(macroId) {
    for (var i = 0; i < structure.macroAreas.length; i++) {
        if (structure.macroAreas[i].id === macroId) {
            if (!structure.macroAreas[i].sottoCategorie) structure.macroAreas[i].sottoCategorie = [];
            structure.macroAreas[i].sottoCategorie.push({id: "sotto_" + Date.now(), name: "Nuova sotto-categoria", terzoLivello: []});
            break;
        }
    }
    saveData();
    renderMacros();
    toast("Aggiunta", "success");
}

function addToLoc(id, macroId, sottoId) {
    if (!cards[id]) return;
    if (!cards[id].locations) cards[id].locations = [];
    
    for (var i = 0; i < cards[id].locations.length; i++) {
        var l = cards[id].locations[i];
        if (l.macroId === macroId && l.sottoId === sottoId) {
            toast("Gia presente", ""); return;
        }
    }
    
    var macroName = "", sottoName = "";
    for (var i = 0; i < structure.macroAreas.length; i++) {
        if (structure.macroAreas[i].id === macroId) {
            macroName = structure.macroAreas[i].name;
            var ss = structure.macroAreas[i].sottoCategorie || [];
            for (var j = 0; j < ss.length; j++) {
                if (ss[j].id === sottoId) { sottoName = ss[j].name; break; }
            }
            break;
        }
    }
    
    cards[id].locations.push({macroId: macroId, sottoId: sottoId, macro: macroName, sotto: sottoName});
    cards[id].lastModifiedBy = user ? user.name : "";
    cards[id].lastModified = new Date().toISOString();
    
    saveData();
    renderAll();
    toast("Aggiunta", "success");
}

function removeLoc(id, macroId, sottoId) {
    if (!cards[id] || !cards[id].locations) return;
    cards[id].locations = cards[id].locations.filter(function(l) {
        return !(l.macroId === macroId && l.sottoId === sottoId);
    });
    saveData();
    renderAll();
    toast("Rimossa", "");
}

function duplicateCard(id) {
    var orig = cards[id];
    if (!orig) return;
    var newId = "dup_" + id + "_" + Date.now();
    cards[newId] = JSON.parse(JSON.stringify(orig));
    cards[newId].label = orig.label + " (copia)";
    cards[newId].locations = [];
    cards[newId].children = [];
    saveData();
    renderAll();
    toast("Duplicata", "success");
}

// ===== CONFIRM =====
function showConfirm(title, msg, fn) {
    document.getElementById("confirmTitle").textContent = title;
    document.getElementById("confirmMsg").textContent = msg;
    confirmFn = fn;
    document.getElementById("confirmModal").classList.add("show");
}

// ===== TOAST =====
function toast(msg, type) {
    var box = document.getElementById("toastBox");
    var t = document.createElement("div");
    t.className = "toast " + (type || "");
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(function() { t.remove(); }, 4000);
}

// ===== EVENT DELEGATION =====
document.addEventListener("click", function(e) {
    var target = e.target;
    
    // Close menu
    var menu = document.getElementById("cardMenu");
    if (!target.closest(".card-menu-btn, .sotto-card-menu, #cardMenu")) {
        menu.classList.remove("show");
    }
    
    // Toggle macro
    var toggleMacro = target.closest("[data-toggle-macro]");
    if (toggleMacro && !target.closest("[data-edit-macro]") && !target.closest("[data-del-macro]")) {
        e.preventDefault();
        e.stopPropagation();
        var macroId = toggleMacro.getAttribute("data-toggle-macro");
        var el = document.getElementById("macro-" + macroId);
        if (el) {
            el.classList.toggle("closed");
            console.log("Toggle macro", macroId, "closed:", el.classList.contains("closed"));
        }
        return;
    }
    
    // Toggle sotto
    var toggleSotto = target.closest("[data-toggle-sotto]");
    if (toggleSotto && !target.closest("[data-edit-sotto]") && !target.closest("[data-del-sotto]")) {
        e.preventDefault();
        e.stopPropagation();
        var cat = target.closest(".sotto-cat");
        if (cat) {
            cat.classList.toggle("closed");
            console.log("Toggle sotto, closed:", cat.classList.contains("closed"));
        }
        return;
    }
    
    // Edit macro name
    if (target.matches("[data-edit-macro]")) {
        e.stopPropagation();
        var macroId = target.getAttribute("data-edit-macro");
        var macro = null;
        for (var i = 0; i < structure.macroAreas.length; i++) {
            if (structure.macroAreas[i].id === macroId) { macro = structure.macroAreas[i]; break; }
        }
        if (macro) {
            var newName = prompt("Nome macro-area:", macro.name);
            if (newName && newName.trim()) {
                macro.name = newName.trim();
                // Aggiorna anche locations nelle cards
                for (var k in cards) {
                    if (cards[k].locations) {
                        for (var j = 0; j < cards[k].locations.length; j++) {
                            if (cards[k].locations[j].macroId === macroId) {
                                cards[k].locations[j].macro = newName.trim();
                            }
                        }
                    }
                }
                saveData();
                renderMacros();
            }
        }
        return;
    }
    
    // Edit sotto name
    if (target.matches("[data-edit-sotto]")) {
        e.stopPropagation();
        var parts = target.getAttribute("data-edit-sotto").split("|");
        var sotto = null;
        for (var i = 0; i < structure.macroAreas.length; i++) {
            if (structure.macroAreas[i].id === parts[0]) {
                var ss = structure.macroAreas[i].sottoCategorie || [];
                for (var j = 0; j < ss.length; j++) {
                    if (ss[j].id === parts[1]) { sotto = ss[j]; break; }
                }
                break;
            }
        }
        if (sotto) {
            var newName = prompt("Nome sotto-categoria:", sotto.name);
            if (newName && newName.trim()) {
                sotto.name = newName.trim();
                // Aggiorna anche locations nelle cards
                for (var k in cards) {
                    if (cards[k].locations) {
                        for (var j = 0; j < cards[k].locations.length; j++) {
                            if (cards[k].locations[j].macroId === parts[0] && cards[k].locations[j].sottoId === parts[1]) {
                                cards[k].locations[j].sotto = newName.trim();
                            }
                        }
                    }
                }
                saveData();
                renderMacros();
            }
        }
        return;
    }
    
    // Delete macro
    if (target.matches("[data-del-macro]")) {
        e.stopPropagation();
        var macroId = target.getAttribute("data-del-macro");
        var cnt = countMacro(macroId);
        showConfirm("Elimina macro-area", cnt > 0 ? cnt + " schede verranno rimosse." : "Confermi?", function() {
            for (var k in cards) {
                if (cards[k].locations) {
                    cards[k].locations = cards[k].locations.filter(function(l) { return l.macroId !== macroId; });
                }
            }
            structure.macroAreas = structure.macroAreas.filter(function(m) { return m.id !== macroId; });
            saveData();
            renderAll();
            toast("Eliminata", "");
        });
        return;
    }
    
    // Delete sotto
    if (target.matches("[data-del-sotto]")) {
        e.stopPropagation();
        var parts = target.getAttribute("data-del-sotto").split("|");
        var cnt = getCardsIn(parts[0], parts[1]).length;
        showConfirm("Elimina sotto-categoria", cnt > 0 ? cnt + " schede verranno rimosse." : "Confermi?", function() {
            for (var k in cards) {
                if (cards[k].locations) {
                    cards[k].locations = cards[k].locations.filter(function(l) { return !(l.macroId === parts[0] && l.sottoId === parts[1]); });
                }
            }
            for (var i = 0; i < structure.macroAreas.length; i++) {
                if (structure.macroAreas[i].id === parts[0]) {
                    structure.macroAreas[i].sottoCategorie = (structure.macroAreas[i].sottoCategorie || []).filter(function(s) { return s.id !== parts[1]; });
                    break;
                }
            }
            saveData();
            renderAll();
            toast("Eliminata", "");
        });
        return;
    }
    
    // Add sotto
    if (target.matches("[data-add-sotto]")) {
        addSotto(target.getAttribute("data-add-sotto"));
        return;
    }
    
    // Open card
    if (target.matches("[data-open]")) {
        openCard(target.getAttribute("data-open"));
        return;
    }
    
    // Remove location
    if (target.matches("[data-remove]")) {
        e.stopPropagation();
        var parts = target.getAttribute("data-remove").split("|");
        removeLoc(parts[0], parts[1], parts[2]);
        return;
    }
    
    // Card menu
    if (target.matches("[data-menu]")) {
        e.stopPropagation();
        var parts = target.getAttribute("data-menu").split("|");
        var cardId = parts[0];
        var macroId = parts[1] || null;
        var sottoId = parts[2] || null;
        
        var rect = target.getBoundingClientRect();
        menu.style.top = rect.bottom + "px";
        menu.style.left = (rect.left - 100) + "px";
        
        var html = '<button data-action="dup" data-card="' + cardId + '">Duplica</button>';
        if (macroId) {
            html += '<button class="danger" data-action="rem" data-card="' + cardId + '" data-macro="' + macroId + '" data-sotto="' + sottoId + '">Rimuovi</button>';
        }
        menu.innerHTML = html;
        menu.classList.add("show");
        return;
    }
    
    // Menu actions
    if (target.matches("[data-action]")) {
        var action = target.getAttribute("data-action");
        var cardId = target.getAttribute("data-card");
        menu.classList.remove("show");
        
        if (action === "dup") duplicateCard(cardId);
        if (action === "rem") removeLoc(cardId, target.getAttribute("data-macro"), target.getAttribute("data-sotto"));
        return;
    }
    
    // Filter buttons
    if (target.matches(".filter-btn")) {
        filter = target.getAttribute("data-filter");
        document.querySelectorAll(".filter-btn").forEach(function(b) {
            b.classList.toggle("active", b.getAttribute("data-filter") === filter);
        });
        renderCards();
        return;
    }
    
    // Load session
    if (target.matches("[data-load-session]")) {
        var i = parseInt(target.getAttribute("data-load-session"));
        var sessions = getSessions();
        var s = sessions[i];
        if (s) {
            showConfirm("Caricare sessione?", "", function() {
                cards = s.cards;
                structure = s.structure;
                saveData();
                renderAll();
                document.getElementById("adminModal").classList.remove("show");
                toast("Caricata", "success");
            });
        }
        return;
    }
    
    // Delete session
    if (target.matches("[data-del-session]")) {
        var i = parseInt(target.getAttribute("data-del-session"));
        var sessions = getSessions();
        sessions.splice(i, 1);
        localStorage.setItem("cs_sessions", JSON.stringify(sessions));
        renderSessions();
        return;
    }
});

// ===== DRAG & DROP =====
document.addEventListener("dragstart", function(e) {
    var el = e.target.closest("[data-id]");
    if (!el) return;
    dragCard = el.getAttribute("data-id");
    dragFrom = el.hasAttribute("data-from-macro") ? {
        macroId: el.getAttribute("data-from-macro"),
        sottoId: el.getAttribute("data-from-sotto")
    } : null;
    el.classList.add("dragging");
    e.dataTransfer.setData("text/plain", dragCard);
});

document.addEventListener("dragend", function(e) {
    var el = e.target.closest("[data-id]");
    if (el) el.classList.remove("dragging");
    dragCard = null;
    dragFrom = null;
});

document.addEventListener("dragover", function(e) {
    var cat = e.target.closest("[data-drop-macro]");
    if (cat) {
        e.preventDefault();
        cat.classList.add("drag-over");
    }
    var card = e.target.closest(".sotto-card");
    if (card) {
        e.preventDefault();
        card.classList.add("drag-over-group");
    }
});

document.addEventListener("dragleave", function(e) {
    var cat = e.target.closest("[data-drop-macro]");
    if (cat) cat.classList.remove("drag-over");
    var card = e.target.closest(".sotto-card");
    if (card) card.classList.remove("drag-over-group");
});

document.addEventListener("drop", function(e) {
    e.preventDefault();
    
    var card = e.target.closest(".sotto-card");
    if (card) {
        card.classList.remove("drag-over-group");
        var targetId = card.getAttribute("data-id");
        if (dragCard && targetId && dragCard !== targetId) {
            if (!cards[targetId].children) cards[targetId].children = [];
            if (cards[targetId].children.indexOf(dragCard) === -1) {
                cards[targetId].children.push(dragCard);
                cards[dragCard].locations = [];
                saveData();
                renderAll();
                toast("Raggruppata", "success");
            }
        }
        return;
    }
    
    var cat = e.target.closest("[data-drop-macro]");
    if (cat) {
        cat.classList.remove("drag-over");
        var macroId = cat.getAttribute("data-drop-macro");
        var sottoId = cat.getAttribute("data-drop-sotto");
        
        if (dragFrom) {
            var c = cards[dragCard];
            if (c && c.locations) {
                c.locations = c.locations.filter(function(l) {
                    return !(l.macroId === dragFrom.macroId && l.sottoId === dragFrom.sottoId);
                });
            }
        }
        
        addToLoc(dragCard, macroId, sottoId);
    }
});

// ===== BUTTON HANDLERS =====
document.getElementById("loginBtn").addEventListener("click", function() {
    var name = document.getElementById("userName").value.trim();
    if (!name) { toast("Inserisci un nome", "error"); return; }
    user = {name: name};
    document.getElementById("loginModal").classList.remove("show");
    init();
});

document.getElementById("userName").addEventListener("keypress", function(e) {
    if (e.key === "Enter") document.getElementById("loginBtn").click();
});

document.getElementById("closeCardBtn").addEventListener("click", function() {
    document.getElementById("cardModal").classList.remove("show");
    selectedCard = null;
});

document.getElementById("saveCardBtn").addEventListener("click", saveCard);

document.getElementById("adminOpenBtn").addEventListener("click", function() {
    renderSessions();
    document.getElementById("adminModal").classList.add("show");
});

document.getElementById("closeAdminBtn").addEventListener("click", function() {
    document.getElementById("adminModal").classList.remove("show");
});

document.getElementById("saveSessionBtn").addEventListener("click", function() {
    var name = document.getElementById("sessionName").value.trim();
    if (!name) { toast("Inserisci nome", "error"); return; }
    var sessions = getSessions();
    sessions.push({name: name, date: new Date().toISOString(), cards: JSON.parse(JSON.stringify(cards)), structure: JSON.parse(JSON.stringify(structure))});
    localStorage.setItem("cs_sessions", JSON.stringify(sessions));
    document.getElementById("sessionName").value = "";
    renderSessions();
    toast("Salvata", "success");
});

document.getElementById("exportBtn").addEventListener("click", exportExcel);
document.getElementById("viewArchBtn").addEventListener("click", viewArchitecture);
document.getElementById("exportHeaderBtn").addEventListener("click", exportExcel);
document.getElementById("importInput").addEventListener("change", function(e) {
    if (e.target.files[0]) importExcel(e.target.files[0]);
    e.target.value = "";
});

document.getElementById("expandAllBtn").addEventListener("click", function() {
    document.querySelectorAll(".macro-area").forEach(function(e) { e.classList.remove("closed"); });
    document.querySelectorAll(".sotto-cat").forEach(function(e) { e.classList.remove("closed"); });
});

document.getElementById("collapseAllBtn").addEventListener("click", function() {
    document.querySelectorAll(".macro-area").forEach(function(e) { e.classList.add("closed"); });
    document.querySelectorAll(".sotto-cat").forEach(function(e) { e.classList.add("closed"); });
});

document.getElementById("addMacroBtn").addEventListener("click", addMacro);

document.getElementById("searchInput").addEventListener("input", renderCards);
document.getElementById("asisFilter").addEventListener("change", renderCards);

document.getElementById("confirmNo").addEventListener("click", function() {
    document.getElementById("confirmModal").classList.remove("show");
    confirmFn = null;
});

document.getElementById("confirmYes").addEventListener("click", function() {
    if (confirmFn) confirmFn();
    document.getElementById("confirmModal").classList.remove("show");
    confirmFn = null;
});

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        document.getElementById("cardModal").classList.remove("show");
        document.getElementById("adminModal").classList.remove("show");
        document.getElementById("confirmModal").classList.remove("show");
        document.getElementById("cardMenu").classList.remove("show");
    }
});
