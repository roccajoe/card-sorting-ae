<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Sorting - Agenzia delle Entrate</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;min-height:100vh}
        
        /* Header */
        .header{background:linear-gradient(135deg,#1a365d,#2c5282);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000}
        .header h1{font-size:16px;display:flex;align-items:center;gap:8px}
        .header-actions{display:flex;gap:8px;align-items:center}
        .connection-status{display:flex;align-items:center;gap:5px;font-size:10px;padding:4px 8px;background:rgba(255,255,255,.15);border-radius:12px}
        .status-dot{width:6px;height:6px;border-radius:50%;background:#fbbf24}
        .status-dot.online{background:#34d399}
        .status-dot.offline{background:#f87171}
        .users-online{font-size:10px;padding:4px 8px;background:rgba(255,255,255,.15);border-radius:12px}
        .btn{padding:5px 10px;border:none;border-radius:5px;cursor:pointer;font-size:11px;font-weight:500;transition:all .2s}
        .btn-primary{background:#3b82f6;color:#fff}
        .btn-success{background:#22c55e;color:#fff}
        .btn-warning{background:#f59e0b;color:#fff}
        .btn-secondary{background:rgba(255,255,255,.2);color:#fff}
        
        /* Nav chips - più compatto */
        .nav-bar{background:#fff;border-bottom:1px solid #e2e8f0;padding:6px 16px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;position:sticky;top:44px;z-index:999}
        .nav-chip{padding:4px 10px;border-radius:12px;font-size:10px;cursor:pointer;transition:all .2s;color:#fff;display:flex;align-items:center;gap:4px}
        .nav-chip:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.2)}
        .nav-chip .chip-count{background:rgba(255,255,255,.3);padding:1px 5px;border-radius:8px;font-size:9px}
        .chip-1{background:#6366f1}.chip-2{background:#f43f5e}.chip-3{background:#0ea5e9}.chip-4{background:#22c55e}.chip-5{background:#f59e0b}.chip-6{background:#ec4899}.chip-7{background:#14b8a6}.chip-8{background:#8b5cf6}.chip-9{background:#0891b2}
        .nav-actions{margin-left:auto;display:flex;gap:6px}
        .nav-actions button{padding:4px 8px;font-size:10px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:4px;cursor:pointer}
        
        /* Main container */
        .main-container{display:flex;height:calc(100vh - 90px)}
        
        /* Sidebar */
        .sidebar{width:380px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0}
        .sidebar-header{padding:10px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
        .sidebar-header h2{font-size:12px;color:#1e293b;margin-bottom:6px}
        .search-row{display:flex;gap:6px}
        .search-box{flex:1;padding:6px 10px;border:1px solid #e2e8f0;border-radius:5px;font-size:11px}
        .asis-filter{padding:6px;border:1px solid #e2e8f0;border-radius:5px;font-size:10px;background:#fff;max-width:140px}
        .filter-row{display:flex;gap:4px;margin-top:6px}
        .filter-btn{flex:1;padding:4px;font-size:9px;border:1px solid #e2e8f0;background:#fff;border-radius:3px;cursor:pointer}
        .filter-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
        
        /* Cards container - drop zone */
        .cards-container{flex:1;overflow-y:auto;padding:8px}
        .cards-container.drag-over{background:#eff6ff}
        .card-count{font-size:9px;color:#64748b;padding:4px 8px;background:#f1f5f9;border-radius:3px;margin-bottom:8px}
        
        /* Card item */
        .card-item{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:8px;margin-bottom:6px;cursor:grab;transition:all .2s;position:relative}
        .card-item:hover{border-color:#3b82f6;box-shadow:0 2px 6px rgba(59,130,246,.15)}
        .card-item.dragging{opacity:.4;cursor:grabbing}
        .card-item.assigned{border-left:3px solid #22c55e}
        .card-item.multi-assigned{border-left:3px solid #8b5cf6}
        .card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}
        .card-id{font-size:8px;color:#94a3b8}
        .card-actions{display:flex;gap:2px}
        .card-actions button{padding:2px 4px;font-size:8px;border:none;background:#f1f5f9;border-radius:3px;cursor:pointer;color:#64748b}
        .card-actions button:hover{background:#e2e8f0;color:#1e293b}
        .card-label{font-size:11px;font-weight:500;color:#1e293b;line-height:1.3;margin-bottom:4px}
        .card-asis{font-size:9px;color:#1e40af;background:#dbeafe;padding:2px 6px;border-radius:3px;display:inline-block;margin-bottom:4px}
        .card-url{font-size:9px;color:#3b82f6;text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
        .card-abstract{font-size:9px;color:#64748b;line-height:1.3;margin-bottom:4px;font-style:italic}
        .card-locations{display:flex;flex-wrap:wrap;gap:3px}
        .location-tag{font-size:8px;padding:2px 5px;background:#dcfce7;color:#166534;border-radius:3px;display:flex;align-items:center;gap:3px;cursor:grab}
        .location-tag:hover{background:#bbf7d0}
        .location-tag .remove-loc{cursor:pointer;font-weight:700}
        .location-tag .remove-loc:hover{color:#dc2626}
        
        /* Board area */
        .board-area{flex:1;overflow-y:auto;padding:12px}
        .board-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .board-header h2{font-size:14px;color:#1e293b}
        
        /* Macro area */
        .macro-area{background:#fff;border-radius:10px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06);overflow:hidden}
        .macro-area.collapsed .macro-content{display:none}
        .macro-header{padding:10px 14px;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
        .macro-title{display:flex;align-items:center;gap:8px;flex:1}
        .macro-icon{font-size:16px}
        .macro-name-input{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:13px;font-weight:600;padding:3px 6px;border-radius:3px;width:260px}
        .macro-badge{background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:10px;margin-left:8px}
        .macro-actions{display:flex;gap:4px}
        .macro-actions button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:3px 6px;border-radius:3px;cursor:pointer;font-size:10px}
        .macro-content{padding:10px}
        .gradient-1{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.gradient-2{background:linear-gradient(135deg,#f43f5e,#fb7185)}.gradient-3{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}.gradient-4{background:linear-gradient(135deg,#22c55e,#4ade80)}.gradient-5{background:linear-gradient(135deg,#f59e0b,#fbbf24)}.gradient-6{background:linear-gradient(135deg,#ec4899,#f472b6)}.gradient-7{background:linear-gradient(135deg,#14b8a6,#2dd4bf)}.gradient-8{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}.gradient-9{background:linear-gradient(135deg,#0891b2,#22d3ee)}
        
        /* Sotto categoria */
        .sotto-cat{background:#f8fafc;border:2px dashed #e2e8f0;border-radius:6px;margin-bottom:8px;min-height:50px;transition:all .2s}
        .sotto-cat.drag-over{border-color:#3b82f6;background:#eff6ff}
        .sotto-header{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:4px 4px 0 0;border-bottom:1px solid #e2e8f0}
        .sotto-name-input{border:none;background:transparent;font-size:12px;font-weight:600;color:#1e293b;width:200px}
        .sotto-count{font-size:9px;color:#64748b;background:#e2e8f0;padding:2px 6px;border-radius:8px}
        .sotto-cards{padding:8px;display:flex;flex-wrap:wrap;gap:4px;min-height:30px}
        .sotto-card{background:#fff;border:1px solid #e2e8f0;border-radius:4px;padding:4px 8px;font-size:10px;cursor:grab;max-width:160px;position:relative}
        .sotto-card:hover{border-color:#3b82f6}
        .sotto-card.dragging{opacity:.4}
        .sotto-card .card-id{font-size:7px}
        .sotto-card .mini-label{font-size:9px;color:#1e293b;line-height:1.2}
        .sotto-card .remove-card{position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#fee2e2;color:#dc2626;font-size:8px;display:none;align-items:center;justify-content:center;cursor:pointer}
        .sotto-card:hover .remove-card{display:flex}
        .terzo-container{margin-left:12px;padding-left:10px;border-left:2px solid #e2e8f0}
        .add-btn{width:100%;padding:6px;border:1px dashed #cbd5e1;background:transparent;border-radius:4px;color:#64748b;cursor:pointer;font-size:10px}
        .add-btn:hover{border-color:#3b82f6;color:#3b82f6;background:#eff6ff}
        .delete-btn{background:transparent;border:none;color:#94a3b8;cursor:pointer;padding:2px 4px;font-size:10px}
        .delete-btn:hover{color:#dc2626}
        
        /* Modals */
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000}
        .modal-overlay.active{display:flex}
        .modal{background:#fff;border-radius:10px;padding:20px;width:480px;max-width:95%;max-height:90vh;overflow-y:auto}
        .modal h3{margin-bottom:14px;color:#1e293b;font-size:15px}
        .modal-input{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:5px;font-size:12px;margin-bottom:8px}
        .modal-input:focus{outline:none;border-color:#3b82f6}
        .modal-row{display:flex;gap:8px;margin-bottom:8px}
        .modal-row .modal-input{margin-bottom:0}
        .modal-label{font-size:10px;color:#64748b;margin-bottom:3px;display:block}
        .modal-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}
        .user-modal{text-align:center}
        .user-modal p{color:#64748b;margin-bottom:16px;font-size:12px}
        
        /* Admin modal */
        .admin-modal{width:600px}
        .session-list{max-height:300px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:12px}
        .session-item{padding:10px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
        .session-item:last-child{border-bottom:none}
        .session-item:hover{background:#f8fafc}
        .session-name{font-weight:600;font-size:13px}
        .session-meta{font-size:10px;color:#64748b}
        .session-actions{display:flex;gap:4px}
        
        /* Confirm dialog */
        .confirm-dialog{width:340px;text-align:center}
        .confirm-dialog p{color:#64748b;font-size:12px;margin-bottom:16px}
        .btn-danger{background:#ef4444;color:#fff}
        
        /* Toast */
        .toast-container{position:fixed;bottom:16px;right:16px;z-index:3000}
        .toast{background:#1e293b;color:#fff;padding:8px 14px;border-radius:6px;margin-top:6px;font-size:11px;animation:slideIn .3s ease}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        .toast.success{background:#22c55e}
        .toast.error{background:#ef4444}
        .toast.info{background:#3b82f6}
        
        /* File input */
        .file-input{display:none}
    </style>
</head>
<body>
    <!-- User Modal -->
    <div class="modal-overlay active" id="userModal">
        <div class="modal user-modal">
            <h3>🏛️ Card Sorting - Agenzia delle Entrate</h3>
            <p>Inserisci il tuo nome per iniziare la sessione</p>
            <input type="text" class="modal-input" id="usernameInput" placeholder="Il tuo nome..." maxlength="30">
            <div class="modal-actions" style="justify-content:center">
                <button class="btn btn-primary" onclick="enterSession()">Entra</button>
            </div>
        </div>
    </div>
    
    <!-- Card Detail Modal -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal">
            <h3>📝 Dettaglio Scheda</h3>
            <div id="cardModalContent"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeCardModal()" style="background:#e2e8f0;color:#1e293b">Chiudi</button>
                <button class="btn btn-primary" onclick="saveCardDetail()">Salva</button>
            </div>
        </div>
    </div>
    
    <!-- Admin/Sessions Modal -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal admin-modal">
            <h3>💾 Gestione Sessioni</h3>
            <div style="margin-bottom:12px">
                <label class="modal-label">Nome sessione corrente</label>
                <div class="modal-row">
                    <input type="text" class="modal-input" id="sessionNameInput" placeholder="Nome sessione...">
                    <button class="btn btn-primary" onclick="saveSession()">Salva</button>
                </div>
            </div>
            <h4 style="font-size:12px;margin-bottom:8px;color:#64748b">Sessioni salvate</h4>
            <div class="session-list" id="sessionList">
                <div style="padding:20px;text-align:center;color:#94a3b8;font-size:11px">Nessuna sessione salvata</div>
            </div>
            <div class="modal-row">
                <button class="btn btn-warning" onclick="exportSession()">📥 Esporta Excel</button>
                <label class="btn btn-secondary" style="background:#e2e8f0;color:#1e293b;cursor:pointer">
                    📤 Importa Excel
                    <input type="file" class="file-input" accept=".xlsx,.csv" onchange="importSession(event)">
                </label>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeAdminModal()" style="background:#e2e8f0;color:#1e293b">Chiudi</button>
            </div>
        </div>
    </div>
    
    <!-- Confirm Dialog -->
    <div class="modal-overlay" id="confirmDialog">
        <div class="modal confirm-dialog">
            <h3 id="confirmTitle">Conferma</h3>
            <p id="confirmMsg">Sei sicuro?</p>
            <div class="modal-actions" style="justify-content:center">
                <button class="btn btn-secondary" onclick="closeConfirm()" style="background:#e2e8f0;color:#1e293b">Annulla</button>
                <button class="btn btn-danger" onclick="execConfirm()">Conferma</button>
            </div>
        </div>
    </div>
    
    <!-- Header -->
    <div class="header">
        <h1>🏛️ Card Sorting - Agenzia delle Entrate</h1>
        <div class="header-actions">
            <div class="connection-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="connText">Connessione...</span>
            </div>
            <div class="users-online" id="usersOnline">👤 1</div>
            <button class="btn btn-secondary" onclick="openAdminModal()">💾 Sessioni</button>
            <button class="btn btn-success" onclick="exportSession()">📥 Excel</button>
        </div>
    </div>
    
    <!-- Nav Bar -->
    <div class="nav-bar" id="navBar">
        <div class="nav-actions">
            <button onclick="toggleAll(true)">▼ Espandi</button>
            <button onclick="toggleAll(false)">▲ Comprimi</button>
            <button onclick="addMacroTop()">+ Nuova area</button>
        </div>
    </div>
    
    <!-- Main -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>📋 Schede (<span id="cardCountNum">0</span>)</h2>
                <div class="search-row">
                    <input type="text" class="search-box" id="searchBox" placeholder="Cerca..." oninput="renderCards()">
                    <select class="asis-filter" id="asisFilter" onchange="renderCards()">
                        <option value="">Tutte le aree</option>
                    </select>
                </div>
                <div class="filter-row">
                    <button class="filter-btn active" data-f="all" onclick="setFilter('all')">Tutte</button>
                    <button class="filter-btn" data-f="todo" onclick="setFilter('todo')">Da fare</button>
                    <button class="filter-btn" data-f="done" onclick="setFilter('done')">Fatte</button>
                </div>
            </div>
            <div class="cards-container" id="cardsContainer" 
                 ondragover="onSidebarDragOver(event)" 
                 ondragleave="onSidebarDragLeave(event)" 
                 ondrop="onSidebarDrop(event)">
            </div>
        </div>
        
        <!-- Board -->
        <div class="board-area" id="boardArea">
            <div id="macroContainer"></div>
            <button class="add-btn" onclick="addMacroBottom()" style="margin-top:8px">+ Aggiungi macro-area in fondo</button>
        </div>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>

<script>

// ============================================================
// INIT
// ============================================================
function initApp(){
    populateAsisFilter();
    if(firebaseConfig.apiKey==="YOUR_API_KEY"){
        initLocal();
    }else{
        initFirebase();
    }
}

function initLocal(){
    setStatus('offline');
    loadLocal();
}

function initFirebase(){
    try{
        firebase.initializeApp(firebaseConfig);
        db=firebase.database();
        db.ref('.info/connected').on('value',s=>{
            if(s.val()){setStatus('online');syncFirebase()}
            else{setStatus('connecting')}
        });
    }catch(e){initLocal()}
}

function setStatus(s){
    const dot=document.getElementById('statusDot');
    const txt=document.getElementById('connText');
    if(s==='online'){dot.className='status-dot online';txt.textContent='Connesso';isOnline=true}
    else if(s==='offline'){dot.className='status-dot offline';txt.textContent='Locale';isOnline=false}
    else{dot.className='status-dot';txt.textContent='Connessione...'}
}

function syncFirebase(){
    db.ref('cards').on('value',s=>{
        cardsData=s.val()||JSON.parse(JSON.stringify(initialCards));
        renderCards();renderNavChips();
    });
    db.ref('structure').on('value',s=>{
        structureData=s.val()||JSON.parse(JSON.stringify(initialStructure));
        renderMacros();renderNavChips();
    });
    if(currentUser){
        const uid='u_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
        const ref=db.ref('users/'+uid);
        ref.set({name:currentUser.name,t:firebase.database.ServerValue.TIMESTAMP});
        ref.onDisconnect().remove();
        db.ref('users').on('value',s=>{
            const n=Object.keys(s.val()||{}).length;
            document.getElementById('usersOnline').textContent='👤 '+n;
        });
    }
}

function loadLocal(){
    const c=localStorage.getItem('cs_cards_v4');
    const s=localStorage.getItem('cs_struct_v4');
    cardsData=c?JSON.parse(c):JSON.parse(JSON.stringify(initialCards));
    structureData=s?JSON.parse(s):JSON.parse(JSON.stringify(initialStructure));
    renderCards();renderMacros();renderNavChips();
}

function saveData(){
    if(db&&isOnline){
        db.ref('cards').set(cardsData);
        db.ref('structure').set(structureData);
    }
    localStorage.setItem('cs_cards_v4',JSON.stringify(cardsData));
    localStorage.setItem('cs_struct_v4',JSON.stringify(structureData));
}

function enterSession(){
    const name=document.getElementById('usernameInput').value.trim();
    if(!name){showToast('Inserisci un nome','error');return}
    currentUser={name};
    document.getElementById('userModal').classList.remove('active');
    initApp();
}
document.getElementById('usernameInput').onkeypress=e=>{if(e.key==='Enter')enterSession()};

// ============================================================
// ASIS FILTER
// ============================================================
function populateAsisFilter(){
    const sel=document.getElementById('asisFilter');
    asisList.forEach(a=>{
        const opt=document.createElement('option');
        opt.value=a;opt.textContent=a;
        sel.appendChild(opt);
    });
}

function setFilter(f){
    currentFilter=f;
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.f===f));
    renderCards();
}

// ============================================================
// NAV CHIPS
// ============================================================
function renderNavChips(){
    const nav=document.getElementById('navBar');
    nav.querySelectorAll('.nav-chip').forEach(c=>c.remove());
    const actions=nav.querySelector('.nav-actions');
    structureData.macroAreas.forEach((m,i)=>{
        const cnt=countMacroCards(m.id);
        const chip=document.createElement('div');
        chip.className='nav-chip chip-'+(i%9+1);
        chip.innerHTML=`<span>${m.icon||icons[i%icons.length]}</span><span>${m.name.length>15?m.name.substring(0,15)+'...':m.name}</span><span class="chip-count">${cnt}</span>`;
        chip.onclick=()=>scrollToMacro(m.id);
        nav.insertBefore(chip,actions);
    });
}

function scrollToMacro(id){
    const el=document.getElementById('macro-'+id);
    if(el){
        el.classList.remove('collapsed');
        el.scrollIntoView({behavior:'smooth',block:'start'});
        el.style.boxShadow='0 0 0 3px #3b82f6';
        setTimeout(()=>el.style.boxShadow='',2000);
    }
}

function toggleAll(expand){
    document.querySelectorAll('.macro-area').forEach(m=>{
        if(expand)m.classList.remove('collapsed');
        else m.classList.add('collapsed');
    });
}

// ============================================================
// RENDER CARDS (sidebar)
// ============================================================
function renderCards(){
    const container=document.getElementById('cardsContainer');
    const search=document.getElementById('searchBox').value.toLowerCase();
    const asisVal=document.getElementById('asisFilter').value;
    
    let cards=Object.entries(cardsData).filter(([id,c])=>{
        const txt=(c.label+' '+(c.altLabel||'')+' '+id+' '+(c.originalMacro||'')).toLowerCase();
        if(search&&!txt.includes(search))return false;
        if(asisVal&&c.asisCategory!==asisVal)return false;
        const done=c.locations&&c.locations.length>0;
        if(currentFilter==='done'&&!done)return false;
        if(currentFilter==='todo'&&done)return false;
        return true;
    }).sort((a,b)=>{
        const aD=a[1].locations&&a[1].locations.length>0;
        const bD=b[1].locations&&b[1].locations.length>0;
        if(aD!==bD)return aD?1:-1;
        return parseInt(a[0])-parseInt(b[0]);
    });
    
    const total=Object.keys(cardsData).length;
    const done=Object.values(cardsData).filter(c=>c.locations&&c.locations.length>0).length;
    document.getElementById('cardCountNum').textContent=`${cards.length}/${total}`;
    
    let html='<div class="card-count">'+total+' totali | '+done+' assegnate | '+(total-done)+' da fare</div>';
    
    for(const [id,c] of cards){
        const isDone=c.locations&&c.locations.length>0;
        const isMulti=c.locations&&c.locations.length>1;
        html+=`<div class="card-item ${isDone?'assigned':''} ${isMulti?'multi-assigned':''}" 
            draggable="true" data-card-id="${id}"
            ondragstart="onCardDragStart(event)" ondragend="onCardDragEnd(event)">
            <div class="card-header">
                <span class="card-id">ID ${id}</span>
                <div class="card-actions">
                    <button onclick="event.stopPropagation();duplicateCard('${id}')" title="Duplica">📋</button>
                    <button onclick="event.stopPropagation();openCardModal('${id}')" title="Modifica">✏️</button>
                </div>
            </div>
            <div class="card-label" onclick="openCardModal('${id}')">${c.altLabel||c.label}</div>
            ${c.asisCategory?'<div class="card-asis">📁 '+c.asisCategory+'</div>':''}
            ${c.abstract?'<div class="card-abstract">'+c.abstract+'</div>':''}
            ${c.url?'<a href="'+c.url+'" target="_blank" class="card-url" onclick="event.stopPropagation()">'+c.url.substring(0,40)+'...</a>':''}
            ${isDone?'<div class="card-locations">'+c.locations.map(l=>`<span class="location-tag" draggable="true" data-card-id="${id}" data-loc='${JSON.stringify(l)}' ondragstart="onLocDragStart(event)">${(l.sotto||l.macro||'').substring(0,15)}${(l.sotto||l.macro||'').length>15?'...':''}<span class="remove-loc" onclick="event.stopPropagation();removeLoc('${id}','${l.macroId}','${l.sottoId}',${l.terzoId?'\"'+l.terzoId+'\"':'null'})">&times;</span></span>`).join('')+'</div>':''}
        </div>`;
    }
    container.innerHTML=html;
}

// ============================================================
// RENDER MACROS
// ============================================================
function renderMacros(){
    const container=document.getElementById('macroContainer');
    let html='';
    structureData.macroAreas.forEach((m,i)=>{
        const cnt=countMacroCards(m.id);
        html+=`<div class="macro-area" id="macro-${m.id}" data-macro-id="${m.id}">
            <div class="macro-header ${gradients[i%9]}" onclick="toggleMacro('${m.id}')">
                <div class="macro-title">
                    <span class="macro-icon">${m.icon||icons[i%icons.length]}</span>
                    <input type="text" class="macro-name-input" value="${m.name}" onclick="event.stopPropagation()" onchange="updateMacroName('${m.id}',this.value)">
                    <span class="macro-badge">${cnt}</span>
                </div>
                <div class="macro-actions">
                    <button onclick="event.stopPropagation();toggleMacro('${m.id}')">▼</button>
                    <button onclick="event.stopPropagation();deleteMacro('${m.id}')">🗑️</button>
                </div>
            </div>
            <div class="macro-content">
                ${(m.sottoCategorie||[]).map(s=>renderSotto(m.id,s)).join('')}
                <button class="add-btn" onclick="addSotto('${m.id}')">+ Sotto-categoria</button>
            </div>
        </div>`;
    });
    container.innerHTML=html;
}

function renderSotto(macroId,sotto){
    const cards=getCardsInSotto(macroId,sotto.id);
    return`<div class="sotto-cat" data-macro-id="${macroId}" data-sotto-id="${sotto.id}"
        ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
        <div class="sotto-header">
            <input type="text" class="sotto-name-input" value="${sotto.name}" onchange="updateSottoName('${macroId}','${sotto.id}',this.value)">
            <div style="display:flex;gap:4px;align-items:center">
                <span class="sotto-count">${cards.length}</span>
                <button class="delete-btn" onclick="deleteSotto('${macroId}','${sotto.id}')">🗑️</button>
            </div>
        </div>
        <div class="sotto-cards">
            ${cards.map(id=>renderSottoCard(id,macroId,sotto.id,null)).join('')}
            ${cards.length===0?'<span style="color:#94a3b8;font-size:9px">Trascina schede qui</span>':''}
        </div>
        ${sotto.terzoLivello&&sotto.terzoLivello.length?'<div class="terzo-container">'+sotto.terzoLivello.map(t=>renderTerzo(macroId,sotto.id,t)).join('')+'</div>':''}
        <div style="padding:4px"><button class="add-btn" onclick="addTerzo('${macroId}','${sotto.id}')" style="font-size:9px">+ 3° livello</button></div>
    </div>`;
}

function renderTerzo(macroId,sottoId,terzo){
    const cards=getCardsInTerzo(macroId,sottoId,terzo.id);
    return`<div class="sotto-cat" data-macro-id="${macroId}" data-sotto-id="${sottoId}" data-terzo-id="${terzo.id}"
        ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)" style="margin:4px 0;background:#f1f5f9">
        <div class="sotto-header" style="padding:6px 8px">
            <input type="text" class="sotto-name-input" value="${terzo.name}" style="font-size:11px" onchange="updateTerzoName('${macroId}','${sottoId}','${terzo.id}',this.value)">
            <div style="display:flex;gap:4px;align-items:center">
                <span class="sotto-count">${cards.length}</span>
                <button class="delete-btn" onclick="deleteTerzo('${macroId}','${sottoId}','${terzo.id}')">🗑️</button>
            </div>
        </div>
        <div class="sotto-cards">
            ${cards.map(id=>renderSottoCard(id,macroId,sottoId,terzo.id)).join('')}
            ${cards.length===0?'<span style="color:#94a3b8;font-size:8px">Trascina qui</span>':''}

function renderSottoCard(cardId,macroId,sottoId,terzoId){
    const c=cardsData[cardId];
    if(!c)return'';
    return`<div class="sotto-card" draggable="true" data-card-id="${cardId}" 
        data-from-macro="${macroId}" data-from-sotto="${sottoId}" ${terzoId?'data-from-terzo="'+terzoId+'"':''}
        ondragstart="onSottoCardDragStart(event)" ondragend="onCardDragEnd(event)"
        onclick="openCardModal('${cardId}')">
        <div class="card-id">ID ${cardId}</div>
        <div class="mini-label">${(c.altLabel||c.label).substring(0,35)}${(c.altLabel||c.label).length>35?'...':''}</div>
        <div class="remove-card" onclick="event.stopPropagation();removeLoc('${cardId}','${macroId}','${sottoId}',${terzoId?'\"'+terzoId+'\"':'null'})">&times;</div>
    </div>`;
}

function toggleMacro(id){document.getElementById('macro-'+id).classList.toggle('collapsed')}

// ============================================================
// DRAG & DROP
// ============================================================
function onCardDragStart(e){
    draggedCardId=e.target.dataset.cardId;
    draggedFromLocation=null;
    e.dataTransfer.setData('text/plain',draggedCardId);
    e.target.classList.add('dragging');
}

function onSottoCardDragStart(e){
    draggedCardId=e.target.dataset.cardId;
    draggedFromLocation={
        macroId:e.target.dataset.fromMacro,
        sottoId:e.target.dataset.fromSotto,
        terzoId:e.target.dataset.fromTerzo||null
    };
    e.dataTransfer.setData('text/plain',draggedCardId);
    e.target.classList.add('dragging');
}

function onLocDragStart(e){
    const loc=JSON.parse(e.target.dataset.loc);
    draggedCardId=e.target.dataset.cardId;
    draggedFromLocation=loc;
    e.dataTransfer.setData('text/plain',draggedCardId);
}

function onCardDragEnd(e){
    e.target.classList.remove('dragging');
    draggedCardId=null;
    draggedFromLocation=null;
}

function onDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over')}
function onDragLeave(e){e.currentTarget.classList.remove('drag-over')}

function onDrop(e){
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const cardId=e.dataTransfer.getData('text/plain');
    const macroId=e.currentTarget.dataset.macroId;
    const sottoId=e.currentTarget.dataset.sottoId;
    const terzoId=e.currentTarget.dataset.terzoId||null;
    
    // Se viene da un'altra location, rimuovi prima
    if(draggedFromLocation){
        removeLocSilent(cardId,draggedFromLocation.macroId,draggedFromLocation.sottoId,draggedFromLocation.terzoId);
    }
    
    addCardToLoc(cardId,macroId,sottoId,terzoId);
}

// Sidebar drop (rimuove da tutte le location)
function onSidebarDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over')}
function onSidebarDragLeave(e){e.currentTarget.classList.remove('drag-over')}
function onSidebarDrop(e){
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const cardId=e.dataTransfer.getData('text/plain');
    if(draggedFromLocation&&cardsData[cardId]){
        removeLocSilent(cardId,draggedFromLocation.macroId,draggedFromLocation.sottoId,draggedFromLocation.terzoId);
        saveData();renderAll();
        showToast('Scheda rimossa dalla categoria','info');
    }
}

// ============================================================
// CARD LOCATIONS
// ============================================================
function addCardToLoc(cardId,macroId,sottoId,terzoId){
    if(!cardsData[cardId])return;
    if(!cardsData[cardId].locations)cardsData[cardId].locations=[];
    
    const exists=cardsData[cardId].locations.some(l=>l.macroId===macroId&&l.sottoId===sottoId&&l.terzoId===terzoId);
    if(exists){showToast('Già presente qui','info');return}
    
    const macro=structureData.macroAreas.find(m=>m.id===macroId);
    const sotto=macro?.sottoCategorie?.find(s=>s.id===sottoId);
    const terzo=terzoId&&sotto?.terzoLivello?sotto.terzoLivello.find(t=>t.id===terzoId):null;
    
    cardsData[cardId].locations.push({macroId,sottoId,terzoId,macro:macro?.name||'',sotto:sotto?.name||'',terzo:terzo?.name||''});
    cardsData[cardId].lastModifiedBy=currentUser?.name;
    cardsData[cardId].lastModified=new Date().toISOString();
    
    saveData();renderAll();
    showToast('Aggiunta a "'+( sotto?.name||'')+ '"','success');
}

function removeLoc(cardId,macroId,sottoId,terzoId){
    removeLocSilent(cardId,macroId,sottoId,terzoId);
    saveData();renderAll();
    showToast('Rimossa','info');
}

function removeLocSilent(cardId,macroId,sottoId,terzoId){
    if(!cardsData[cardId]?.locations)return;
    cardsData[cardId].locations=cardsData[cardId].locations.filter(l=>{
        if(terzoId)return!(l.macroId===macroId&&l.sottoId===sottoId&&l.terzoId===terzoId);
        return!(l.macroId===macroId&&l.sottoId===sottoId&&!l.terzoId);
    });
}

function getCardsInSotto(macroId,sottoId){
    return Object.keys(cardsData).filter(id=>cardsData[id].locations?.some(l=>l.macroId===macroId&&l.sottoId===sottoId&&!l.terzoId));
}

function getCardsInTerzo(macroId,sottoId,terzoId){
    return Object.keys(cardsData).filter(id=>cardsData[id].locations?.some(l=>l.macroId===macroId&&l.sottoId===sottoId&&l.terzoId===terzoId));
}

function countMacroCards(macroId){
    return Object.values(cardsData).filter(c=>c.locations?.some(l=>l.macroId===macroId)).length;
}

// ============================================================
// DUPLICATE CARD
// ============================================================
function duplicateCard(cardId){
    const orig=cardsData[cardId];
    if(!orig)return;
    const newId='dup_'+cardId+'_'+Date.now();
    cardsData[newId]={
        ...JSON.parse(JSON.stringify(orig)),
        label:orig.label+' (copia)',
        locations:[],
        lastModifiedBy:currentUser?.name,
        lastModified:new Date().toISOString()
    };
    saveData();renderAll();
    showToast('Scheda duplicata: ID '+newId,'success');
}

        </div>`:''}

function closeCardModal(){document.getElementById('cardModal').classList.remove('active');selectedCardId=null}

function saveCardDetail(){
    if(!selectedCardId)return;
    const c=cardsData[selectedCardId];
    c.altLabel=document.getElementById('inp_altLabel').value.trim()||null;
    c.abstract=document.getElementById('inp_abstract').value.trim()||null;
    c.targetUser=document.getElementById('inp_target').value.trim()||null;
    c.userNeed=document.getElementById('inp_need').value.trim()||null;
    c.useCase=document.getElementById('inp_usecase').value.trim()||null;
    c.notes=document.getElementById('inp_notes').value.trim()||null;
    c.lastModifiedBy=currentUser?.name;
    c.lastModified=new Date().toISOString();
    saveData();renderAll();closeCardModal();

// ============================================================
// STRUCTURE MANAGEMENT
// ============================================================
function addMacroTop(){
    const newId='macro_'+Date.now();
    structureData.macroAreas.unshift({id:newId,name:'Nuova Macro-area',icon:icons[0],sottoCategorie:[{id:'sotto_'+Date.now(),name:'Nuova sotto-categoria',terzoLivello:[]}]});
    saveData();renderAll();
    showToast('Macro-area aggiunta in alto','success');
    scrollToMacro(newId);
}

function addMacroBottom(){
    const newId='macro_'+Date.now();
    const idx=structureData.macroAreas.length;
    structureData.macroAreas.push({id:newId,name:'Nuova Macro-area',icon:icons[idx%icons.length],sottoCategorie:[{id:'sotto_'+Date.now(),name:'Nuova sotto-categoria',terzoLivello:[]}]});
    saveData();renderAll();
    showToast('Macro-area aggiunta','success');
}

function deleteMacro(macroId){
    showConfirm('Elimina macro-area?','Le schede assegnate verranno rimosse.',()=>{
        Object.keys(cardsData).forEach(id=>{
            if(cardsData[id].locations)cardsData[id].locations=cardsData[id].locations.filter(l=>l.macroId!==macroId);
        });
        structureData.macroAreas=structureData.macroAreas.filter(m=>m.id!==macroId);
        saveData();renderAll();showToast('Eliminata','info');
    });
}

function updateMacroName(macroId,name){
    const m=structureData.macroAreas.find(x=>x.id===macroId);
    if(m){m.name=name;Object.values(cardsData).forEach(c=>{if(c.locations)c.locations.forEach(l=>{if(l.macroId===macroId)l.macro=name})});saveData();renderNavChips()}
}

function addSotto(macroId){
    const m=structureData.macroAreas.find(x=>x.id===macroId);
    if(m){if(!m.sottoCategorie)m.sottoCategorie=[];m.sottoCategorie.push({id:'sotto_'+Date.now(),name:'Nuova sotto-categoria',terzoLivello:[]});saveData();renderMacros();showToast('Aggiunta','success')}
}

function deleteSotto(macroId,sottoId){
    showConfirm('Elimina sotto-categoria?','',()=>{
        const m=structureData.macroAreas.find(x=>x.id===macroId);
        if(m){m.sottoCategorie=m.sottoCategorie.filter(s=>s.id!==sottoId);Object.values(cardsData).forEach(c=>{if(c.locations)c.locations=c.locations.filter(l=>!(l.macroId===macroId&&l.sottoId===sottoId))});saveData();renderAll();showToast('Eliminata','info')}
    });
}

function updateSottoName(macroId,sottoId,name){
    const m=structureData.macroAreas.find(x=>x.id===macroId);
    const s=m?.sottoCategorie?.find(x=>x.id===sottoId);
    if(s){s.name=name;Object.values(cardsData).forEach(c=>{if(c.locations)c.locations.forEach(l=>{if(l.macroId===macroId&&l.sottoId===sottoId)l.sotto=name})});saveData()}
}

function addTerzo(macroId,sottoId){
    const m=structureData.macroAreas.find(x=>x.id===macroId);
    const s=m?.sottoCategorie?.find(x=>x.id===sottoId);
    if(s){if(!s.terzoLivello)s.terzoLivello=[];s.terzoLivello.push({id:'terzo_'+Date.now(),name:'Nuovo 3° livello'});saveData();renderMacros();showToast('Aggiunto','success')}
}

function deleteTerzo(macroId,sottoId,terzoId){
    showConfirm('Elimina 3° livello?','',()=>{
        const m=structureData.macroAreas.find(x=>x.id===macroId);
        const s=m?.sottoCategorie?.find(x=>x.id===sottoId);
        if(s?.terzoLivello){s.terzoLivello=s.terzoLivello.filter(t=>t.id!==terzoId);Object.values(cardsData).forEach(c=>{if(c.locations)c.locations=c.locations.filter(l=>!(l.macroId===macroId&&l.sottoId===sottoId&&l.terzoId===terzoId))});saveData();renderAll();showToast('Eliminato','info')}
    });
}

function updateTerzoName(macroId,sottoId,terzoId,name){
    const m=structureData.macroAreas.find(x=>x.id===macroId);
    const s=m?.sottoCategorie?.find(x=>x.id===sottoId);
    const t=s?.terzoLivello?.find(x=>x.id===terzoId);
    if(t){t.name=name;Object.values(cardsData).forEach(c=>{if(c.locations)c.locations.forEach(l=>{if(l.macroId===macroId&&l.sottoId===sottoId&&l.terzoId===terzoId)l.terzo=name})});saveData()}
}

// ============================================================
// SESSIONS MANAGEMENT
// ============================================================
function openAdminModal(){
    renderSessionList();
    document.getElementById('adminModal').classList.add('active');
}

function closeAdminModal(){document.getElementById('adminModal').classList.remove('active')}

function getSessions(){
    const raw=localStorage.getItem('cs_sessions')||'[]';
    return JSON.parse(raw);
}

function saveSessions(sessions){
    localStorage.setItem('cs_sessions',JSON.stringify(sessions));
}

function renderSessionList(){
    const sessions=getSessions();
    const list=document.getElementById('sessionList');
    if(sessions.length===0){
        list.innerHTML='<div style="padding:20px;text-align:center;color:#94a3b8;font-size:11px">Nessuna sessione salvata</div>';
        return;
    }
    list.innerHTML=sessions.map((s,i)=>`
        <div class="session-item">
            <div>
                <div class="session-name">${s.name}</div>
                <div class="session-meta">${new Date(s.date).toLocaleString('it-IT')} - ${s.cardCount} schede</div>
            </div>
            <div class="session-actions">
                <button class="btn btn-primary" onclick="loadSession(${i})">Carica</button>
                <button class="btn btn-danger" onclick="deleteSession(${i})">🗑️</button>
            </div>
        </div>
    `).join('');
}

function saveSession(){
    const name=document.getElementById('sessionNameInput').value.trim();
    if(!name){showToast('Inserisci un nome','error');return}
    const sessions=getSessions();
    sessions.push({
        name,
        date:new Date().toISOString(),
        cardCount:Object.keys(cardsData).length,
        cards:JSON.parse(JSON.stringify(cardsData)),
        structure:JSON.parse(JSON.stringify(structureData))
    });
    saveSessions(sessions);
    document.getElementById('sessionNameInput').value='';
    renderSessionList();
    showToast('Sessione "'+name+'" salvata','success');
}

function loadSession(idx){
    const sessions=getSessions();
    const s=sessions[idx];
    if(!s)return;
    showConfirm('Caricare sessione "'+s.name+'"?','I dati correnti verranno sostituiti.',()=>{
        cardsData=s.cards;
        structureData=s.structure;
        saveData();renderAll();closeAdminModal();
        showToast('Sessione caricata','success');
    });
}

function deleteSession(idx){
    const sessions=getSessions();
    showConfirm('Eliminare questa sessione?','',()=>{
        sessions.splice(idx,1);
        saveSessions(sessions);
        renderSessionList();
        showToast('Sessione eliminata','info');
    });
}

// ============================================================
// EXPORT / IMPORT
// ============================================================
function exportSession(){
    const rows=[['ID','URL','Label Originale','Label Proposta','Categoria ASIS','Abstract','Target','User Need','Use Case','Nuova Macro','Nuova Sotto','3° Livello','Note','Modificato da','Data']];
    Object.entries(cardsData).forEach(([id,c])=>{
        if(c.locations&&c.locations.length>0){
            c.locations.forEach(l=>{
                rows.push([id,c.url||'',c.label,c.altLabel||'',c.asisCategory||'',c.abstract||'',c.targetUser||'',c.userNeed||'',c.useCase||'',l.macro||'',l.sotto||'',l.terzo||'',c.notes||'',c.lastModifiedBy||'',c.lastModified?new Date(c.lastModified).toLocaleString('it-IT'):'']);
            });
        }else{
            rows.push([id,c.url||'',c.label,c.altLabel||'',c.asisCategory||'',c.abstract||'',c.targetUser||'',c.userNeed||'',c.useCase||'','','','',c.notes||'',c.lastModifiedBy||'',c.lastModified?new Date(c.lastModified).toLocaleString('it-IT'):'']);
        }
    });
    const ws=XLSX.utils.aoa_to_sheet(rows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Card Sorting');
    
    // Struttura
    const sRows=[['Macro-area','Sotto-categoria','3° Livello','N. Schede']];
    structureData.macroAreas.forEach(m=>{
        (m.sottoCategorie||[]).forEach(s=>{
            sRows.push([m.name,s.name,'',getCardsInSotto(m.id,s.id).length]);
            if(s.terzoLivello){
                s.terzoLivello.forEach(t=>{
                    sRows.push([m.name,s.name,t.name,getCardsInTerzo(m.id,s.id,t.id).length]);
                });
            }
        });
    });
    const ws2=XLSX.utils.aoa_to_sheet(sRows);
    XLSX.utils.book_append_sheet(wb,ws2,'Struttura');
    
    XLSX.writeFile(wb,'CardSorting_AE_'+new Date().toISOString().split('T')[0]+'.xlsx');
    showToast('Excel esportato','success');
}

function importSession(e){
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
        try{
            const wb=XLSX.read(ev.target.result,{type:'binary'});
            const ws=wb.Sheets[wb.SheetNames[0]];
            const data=XLSX.utils.sheet_to_json(ws,{header:1});
            
            // Importa cards (header in riga 0)
            const headers=data[0];
            const idIdx=headers.indexOf('ID');
            const altIdx=headers.indexOf('Label Proposta');
            const absIdx=headers.indexOf('Abstract');
            const targetIdx=headers.indexOf('Target');
            const needIdx=headers.indexOf('User Need');
            const useIdx=headers.indexOf('Use Case');
            const notesIdx=headers.indexOf('Note');
            
            let imported=0;
            for(let i=1;i<data.length;i++){
                const row=data[i];
                const id=String(row[idIdx]);
                if(cardsData[id]){
                    if(altIdx>=0&&row[altIdx])cardsData[id].altLabel=row[altIdx];
                    if(absIdx>=0&&row[absIdx])cardsData[id].abstract=row[absIdx];
                    if(targetIdx>=0&&row[targetIdx])cardsData[id].targetUser=row[targetIdx];
                    if(needIdx>=0&&row[needIdx])cardsData[id].userNeed=row[needIdx];
                    if(useIdx>=0&&row[useIdx])cardsData[id].useCase=row[useIdx];
                    if(notesIdx>=0&&row[notesIdx])cardsData[id].notes=row[notesIdx];
                    imported++;
                }
            }
            
            saveData();renderAll();
            showToast('Importate '+imported+' schede','success');
        }catch(err){
            showToast('Errore import: '+err.message,'error');
        }
    };
    reader.readAsBinaryString(file);
    e.target.value='';
}

// ============================================================
// UTILS
// ============================================================
function renderAll(){renderCards();renderMacros();renderNavChips()}

function showToast(msg,type='info'){
    const c=document.getElementById('toastContainer');
    const t=document.createElement('div');
    t.className='toast '+type;
    t.textContent=msg;
    c.appendChild(t);
    setTimeout(()=>t.remove(),3000);
}

function showConfirm(title,msg,cb){
    document.getElementById('confirmTitle').textContent=title;
    document.getElementById('confirmMsg').textContent=msg;
    confirmCb=cb;
    document.getElementById('confirmDialog').classList.add('active');
}

function closeConfirm(){document.getElementById('confirmDialog').classList.remove('active');confirmCb=null}
function execConfirm(){if(confirmCb)confirmCb();closeConfirm()}

document.getElementById('usernameInput').focus();
