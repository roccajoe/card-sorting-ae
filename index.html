<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Sorting - Agenzia delle Entrate</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Roboto,sans-serif;background:#f0f2f5;min-height:100vh}
.header{background:linear-gradient(135deg,#1a365d,#2c5282);color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000}
.header h1{font-size:16px}
.header-actions{display:flex;gap:8px;align-items:center}
.connection-status{display:flex;align-items:center;gap:5px;font-size:10px;padding:4px 8px;background:rgba(255,255,255,.15);border-radius:12px}
.status-dot{width:6px;height:6px;border-radius:50%;background:#fbbf24}
.status-dot.online{background:#34d399}
.status-dot.offline{background:#f87171}
.btn{padding:5px 10px;border:none;border-radius:5px;cursor:pointer;font-size:11px;font-weight:500}
.btn-primary{background:#3b82f6;color:#fff}
.btn-success{background:#22c55e;color:#fff}
.btn-secondary{background:rgba(255,255,255,.2);color:#fff}
.nav-bar{background:#fff;border-bottom:1px solid #e2e8f0;padding:6px 16px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;position:sticky;top:44px;z-index:999}
.nav-chip{padding:4px 10px;border-radius:12px;font-size:10px;cursor:pointer;color:#fff;display:flex;align-items:center;gap:4px}
.nav-chip:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.chip-1{background:#6366f1}.chip-2{background:#f43f5e}.chip-3{background:#0ea5e9}.chip-4{background:#22c55e}.chip-5{background:#f59e0b}.chip-6{background:#ec4899}.chip-7{background:#14b8a6}.chip-8{background:#8b5cf6}.chip-9{background:#0891b2}
.nav-actions{margin-left:auto;display:flex;gap:6px}
.nav-actions button{padding:4px 8px;font-size:10px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:4px;cursor:pointer}
.main-container{display:flex;height:calc(100vh - 90px)}
.sidebar{width:380px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column}
.sidebar-header{padding:10px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.sidebar-header h2{font-size:12px;margin-bottom:6px}
.search-row{display:flex;gap:6px}
.search-box{flex:1;padding:6px 10px;border:1px solid #e2e8f0;border-radius:5px;font-size:11px}
.asis-filter{padding:6px;border:1px solid #e2e8f0;border-radius:5px;font-size:10px;max-width:140px}
.filter-row{display:flex;gap:4px;margin-top:6px}
.filter-btn{flex:1;padding:4px;font-size:9px;border:1px solid #e2e8f0;background:#fff;border-radius:3px;cursor:pointer}
.filter-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.cards-container{flex:1;overflow-y:auto;padding:8px}
.cards-container.drag-over{background:#eff6ff}
.card-count{font-size:9px;color:#64748b;padding:4px 8px;background:#f1f5f9;border-radius:3px;margin-bottom:8px}
.card-item{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:8px;margin-bottom:6px;cursor:grab}
.card-item:hover{border-color:#3b82f6;box-shadow:0 2px 6px rgba(59,130,246,.15)}
.card-item.dragging{opacity:.4}
.card-item.assigned{border-left:3px solid #22c55e}
.card-item.multi-assigned{border-left:3px solid #8b5cf6}
.card-header{display:flex;justify-content:space-between;margin-bottom:4px}
.card-id{font-size:8px;color:#94a3b8}
.card-actions{display:flex;gap:2px}
.card-actions button{padding:2px 6px;font-size:10px;border:none;border-radius:3px;cursor:pointer}
.dup-btn{background:#22c55e;color:#fff;font-weight:bold}
.edit-btn{background:#f1f5f9;color:#64748b}
.card-label{font-size:11px;font-weight:500;color:#1e293b;line-height:1.3;margin-bottom:4px;cursor:pointer}
.card-asis{font-size:9px;color:#1e40af;background:#dbeafe;padding:2px 6px;border-radius:3px;display:inline-block;margin-bottom:4px}
.card-url{font-size:9px;color:#3b82f6;text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}
.card-locations{display:flex;flex-wrap:wrap;gap:3px}
.location-tag{font-size:8px;padding:2px 5px;background:#dcfce7;color:#166534;border-radius:3px;display:flex;align-items:center;gap:3px}

.board-area{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column}
#macroContainer {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    align-items: start;
}
@media (max-width: 1200px) {
    #macroContainer { grid-template-columns: 1fr; }
}
.macro-area{background:#fff;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.06);overflow:hidden}

.macro-area.collapsed .macro-content{display:none}
.macro-header{padding:10px 14px;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.macro-title{display:flex;align-items:center;gap:8px;flex:1}
.macro-icon{font-size:16px}
.macro-name-input{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:13px;font-weight:600;padding:3px 6px;border-radius:3px;width:260px}
.macro-badge{background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:10px;margin-left:8px}
.macro-actions button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:3px 6px;border-radius:3px;cursor:pointer;font-size:10px;margin-left:4px}
.macro-content{padding:10px}
.gradient-1{background:linear-gradient(135deg,#6366f1,#8b5cf6)}.gradient-2{background:linear-gradient(135deg,#f43f5e,#fb7185)}.gradient-3{background:linear-gradient(135deg,#0ea5e9,#38bdf8)}.gradient-4{background:linear-gradient(135deg,#22c55e,#4ade80)}.gradient-5{background:linear-gradient(135deg,#f59e0b,#fbbf24)}.gradient-6{background:linear-gradient(135deg,#ec4899,#f472b6)}.gradient-7{background:linear-gradient(135deg,#14b8a6,#2dd4bf)}.gradient-8{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}.gradient-9{background:linear-gradient(135deg,#0891b2,#22d3ee)}
.sotto-cat{background:#f8fafc;border:2px dashed #e2e8f0;border-radius:6px;margin-bottom:8px;min-height:50px}
.sotto-cat.drag-over{border-color:#3b82f6;background:#eff6ff}
.sotto-header{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:4px 4px 0 0;border-bottom:1px solid #e2e8f0}
.sotto-name-input{border:none;background:transparent;font-size:12px;font-weight:600;color:#1e293b;width:200px}
.sotto-count{font-size:9px;color:#64748b;background:#e2e8f0;padding:2px 6px;border-radius:8px}
.sotto-cards{padding:8px;display:flex;flex-wrap:wrap;gap:4px;min-height:30px}
.sotto-card{background:#fff;border:1px solid #e2e8f0;border-radius:4px;padding:4px 8px;font-size:10px;cursor:pointer;max-width:160px;position:relative}
.sotto-card:hover{border-color:#3b82f6}
.sotto-card .remove-card{position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#fee2e2;color:#dc2626;font-size:8px;display:none;align-items:center;justify-content:center;cursor:pointer}
.sotto-card:hover .remove-card{display:flex}
.edit-sotto-card{opacity:0.5;transition:opacity .2s}
.sotto-card:hover .edit-sotto-card{opacity:1}
.sotto-card.drag-over-card{border:2px solid #8b5cf6;background:#f5f3ff}
.sotto-card.is-group{border-left:3px solid #8b5cf6}
.card-group{margin-left:12px;padding-left:8px;border-left:2px dashed #c4b5fd;margin-top:4px}
.card-group .sotto-card{background:#faf5ff;border:1px dashed #c4b5fd;max-width:150px}
.card-group .sotto-card:hover{border-color:#8b5cf6}
.group-badge{font-size:7px;background:#8b5cf6;color:#fff;padding:1px 4px;border-radius:3px;margin-left:4px}
.ungroup-btn{font-size:8px;color:#8b5cf6;cursor:pointer;margin-left:4px}
.ungroup-btn:hover{color:#7c3aed}
.dup-sotto-btn{font-size:9px;cursor:pointer;padding:1px 4px;background:#dcfce7;color:#16a34a;border-radius:3px;font-weight:bold}
.dup-sotto-btn:hover{background:#bbf7d0}
.terzo-container{margin-left:12px;padding-left:10px;border-left:2px solid #e2e8f0}
.add-btn{width:100%;padding:6px;border:1px dashed #cbd5e1;background:transparent;border-radius:4px;color:#64748b;cursor:pointer;font-size:10px}
.add-btn:hover{border-color:#3b82f6;color:#3b82f6;background:#eff6ff}
.delete-btn{background:transparent;border:none;color:#94a3b8;cursor:pointer;padding:2px 4px;font-size:10px}
.delete-btn:hover{color:#dc2626}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:10px;padding:20px;width:480px;max-width:95%;max-height:90vh;overflow-y:auto}
.modal h3{margin-bottom:14px;font-size:15px}
.modal-input{width:100%;padding:8px 10px;border:1px solid #e2e8f0;border-radius:5px;font-size:12px;margin-bottom:8px}
.modal-label{font-size:10px;color:#64748b;margin-bottom:3px;display:block}
.modal-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:14px}
.modal-row{display:flex;gap:8px;margin-bottom:8px}
.user-modal{text-align:center}
.user-modal p{color:#64748b;margin-bottom:16px;font-size:12px}
.admin-modal{width:600px}
.session-list{max-height:300px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:12px}
.session-item{padding:10px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.session-name{font-weight:600;font-size:13px}
.session-meta{font-size:10px;color:#64748b}
.confirm-dialog{width:340px;text-align:center}
.confirm-dialog p{color:#64748b;font-size:12px;margin-bottom:16px}
.btn-danger{background:#ef4444;color:#fff}
.toast-container{position:fixed;bottom:16px;right:16px;z-index:3000}
.toast{background:#1e293b;color:#fff;padding:8px 14px;border-radius:6px;margin-top:6px;font-size:11px;animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.success{background:#22c55e}.toast.error{background:#ef4444}.toast.info{background:#3b82f6}
.file-input{display:none}
</style>
</head>
<body>
<div class="modal-overlay active" id="userModal">
<div class="modal user-modal">
<h3>Card Sorting - Agenzia delle Entrate</h3>
<p>Inserisci il tuo nome per iniziare</p>
<input type="text" class="modal-input" id="usernameInput" placeholder="Il tuo nome..." maxlength="30">
<div class="modal-actions" style="justify-content:center">
<button class="btn btn-primary" id="enterBtn">Entra</button>
</div>
</div>
</div>
<div class="modal-overlay" id="cardModal">
<div class="modal">
<h3>Dettaglio Scheda</h3>
<div id="cardModalContent"></div>
<div class="modal-actions">
<button class="btn" id="closeCardBtn" style="background:#e2e8f0;color:#1e293b">Chiudi</button>
<button class="btn btn-primary" id="saveCardBtn">Salva</button>
</div>
</div>
</div>
<div class="modal-overlay" id="adminModal">
<div class="modal admin-modal">
<h3>Gestione Sessioni</h3>
<div style="margin-bottom:12px">
<label class="modal-label">Nome sessione</label>
<div class="modal-row">
<input type="text" class="modal-input" id="sessionNameInput" placeholder="Nome sessione..." style="margin:0">
<button class="btn btn-primary" id="saveSessionBtn">Salva</button>
</div>
</div>
<div class="session-list" id="sessionList"></div>
<div class="modal-row">
<button class="btn" style="background:#f59e0b;color:#fff" id="exportBtn">Esporta Excel</button>
<label class="btn" style="background:#e2e8f0;color:#1e293b;cursor:pointer">
Importa Excel<input type="file" class="file-input" id="importFile" accept=".xlsx,.csv">
</label>
</div>
<div class="modal-actions">
<button class="btn" id="closeAdminBtn" style="background:#e2e8f0;color:#1e293b">Chiudi</button>
</div>
</div>
</div>
<div class="modal-overlay" id="confirmDialog">
<div class="modal confirm-dialog">
<h3 id="confirmTitle">Conferma</h3>
<p id="confirmMsg">Sei sicuro?</p>
<div class="modal-actions" style="justify-content:center">
<button class="btn" id="cancelConfirmBtn" style="background:#e2e8f0;color:#1e293b">Annulla</button>
<button class="btn btn-danger" id="execConfirmBtn">Conferma</button>
</div>
</div>
</div>
<div class="header">
<h1>Card Sorting - Agenzia delle Entrate</h1>
<div class="header-actions">
<div class="connection-status"><span class="status-dot" id="statusDot"></span><span id="connText">Connessione...</span></div>
<div id="usersOnline" style="font-size:10px;padding:4px 8px;background:rgba(255,255,255,.15);border-radius:12px">1 utente</div>
<button class="btn btn-secondary" id="adminBtn">Sessioni</button>
<button class="btn btn-success" id="exportBtnHeader">Excel</button>
</div>
</div>
<div class="nav-bar" id="navBar">
<div class="nav-actions">
<button id="expandAllBtn">Espandi</button>
<button id="collapseAllBtn">Comprimi</button>
<button id="addMacroTopBtn" style="background:#22c55e;color:#fff">+ Nuova area</button>
</div>
</div>
<div class="main-container">
<div class="sidebar">
<div class="sidebar-header">
<h2>Schede (<span id="cardCountNum">0</span>)</h2>
<div class="search-row">
<input type="text" class="search-box" id="searchBox" placeholder="Cerca...">
<select class="asis-filter" id="asisFilter"><option value="">Tutte</option></select>
</div>
<div class="filter-row">
<button class="filter-btn active" data-f="all">Tutte</button>
<button class="filter-btn" data-f="todo">Da fare</button>
<button class="filter-btn" data-f="done">Fatte</button>
</div>
</div>
<div class="cards-container" id="cardsContainer"></div>
</div>
<div class="board-area" id="boardArea">
<div id="macroContainer"></div>
<button class="add-btn" id="addMacroBottomBtn" style="margin-top:8px">+ Aggiungi macro-area</button>
</div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script>
// ===== CONFIG =====
var firebaseConfig = {
    apiKey: "FIREBASE_API_KEY",
    authDomain: "FIREBASE_AUTH_DOMAIN",
    databaseURL: "FIREBASE_DATABASE_URL",
    projectId: "FIREBASE_PROJECT_ID"
};

// I dati iniziali e lo stato rimangono invariati rispetto ai file precedenti...
// [Sotto riporto solo la sezione corretta degli Event Listeners e del Toggle]

var cardsData = {};
var structureData = {macroAreas: []};
var currentFilter = "all";
var currentUser = null;
var isOnline = false;
var db = null;
var draggedCardId = null;
var draggedFromLoc = null;
var confirmCb = null;
var selectedCardId = null;
var asisList = ["ADER (Riscossione)", "Accertamenti e regolarizzazioni", "Agevolazioni", "Comunicazioni", "Dichiarazioni", "FabbricatiTerreni", "Istanze", "Pagamenti", "Registrazione contratti - atti", "Rimborsi", "Servizi"];
var gradients = ["gradient-1","gradient-2","gradient-3","gradient-4","gradient-5","gradient-6","gradient-7","gradient-8","gradient-9"];
var icons = ["⚖️","🎁","📋","🏠","💳","🏢","🌍","📊","🪪"];

// [Funzioni di inizializzazione, render e salvataggio omesse per brevità, sono identiche all'ultima versione stabile]
// ... 

// ===== EVENT LISTENERS (CORRETTI PER TOGGLE ACCORDION) =====
document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("enterBtn").onclick = enterSession;
    document.getElementById("usernameInput").onkeypress = function(e) { if (e.key === "Enter") enterSession(); };
    document.getElementById("closeCardBtn").onclick = closeCardModal;
    document.getElementById("saveCardBtn").onclick = saveCardDetail;
    document.getElementById("adminBtn").onclick = openAdminModal;
    document.getElementById("closeAdminBtn").onclick = closeAdminModal;
    document.getElementById("saveSessionBtn").onclick = saveSession;
    document.getElementById("exportBtn").onclick = exportSession;
    document.getElementById("exportBtnHeader").onclick = exportSession;
    document.getElementById("cancelConfirmBtn").onclick = closeConfirm;
    document.getElementById("execConfirmBtn").onclick = execConfirm;
    document.getElementById("expandAllBtn").onclick = function() { toggleAll(true); };
    document.getElementById("collapseAllBtn").onclick = function() { toggleAll(false); };
    document.getElementById("addMacroTopBtn").onclick = addMacroTop;
    document.getElementById("addMacroBottomBtn").onclick = addMacroBottom;
    document.getElementById("searchBox").oninput = renderCards;
    document.getElementById("asisFilter").onchange = renderCards;
    document.querySelectorAll(".filter-btn").forEach(function(btn) {
        btn.onclick = function() { setFilter(this.getAttribute("data-f")); };
    });

    document.addEventListener("click", function(e) {
        // --- FIX TOGGLE ACCORDION ---
        // Cerchiamo l'antenato più vicino con data-toggle (permette di cliccare anche su icone/testo)
        const toggleTarget = e.target.closest("[data-toggle]");
        // Se troviamo il trigger MA non è un click dentro l'input di rinomina
        if (toggleTarget && !e.target.closest(".macro-name-input")) {
            e.stopPropagation();
            var id = toggleTarget.getAttribute("data-toggle");
            var el = document.getElementById("macro-" + id);
            if (el) el.classList.toggle("collapsed");
            return;
        }

        // --- ALTRI EVENTI DELEGATI ---
        if (e.target.matches("[data-dup-sotto]")) {
            e.stopPropagation();
            duplicateCard(e.target.getAttribute("data-dup-sotto"));
            return;
        }
        if (e.target.matches("[data-ungroup]")) {
            e.stopPropagation();
            ungroupCard(e.target.getAttribute("data-ungroup"));
            return;
        }
        if (e.target.matches("[data-edit-sotto]")) {
            e.stopPropagation();
            openCardModal(e.target.getAttribute("data-edit-sotto"));
            return;
        }
        if (e.target.matches("[data-dup]")) {
            e.stopPropagation();
            duplicateCard(e.target.getAttribute("data-dup"));
            return;
        }
        if (e.target.matches("[data-edit]")) {
            e.stopPropagation();
            openCardModal(e.target.getAttribute("data-edit"));
            return;
        }
        if (e.target.matches(".remove-loc")) {
            e.stopPropagation();
            removeLoc(e.target.getAttribute("data-card"), e.target.getAttribute("data-macro"), e.target.getAttribute("data-sotto"), e.target.getAttribute("data-terzo") || null);
            return;
        }
        if (e.target.matches("[data-remove-card]")) {
            e.stopPropagation();
            var parts = e.target.getAttribute("data-remove-card").split("|");
            removeLoc(parts[0], parts[1], parts[2], parts[3] || null);
            return;
        }
        if (e.target.matches("[data-delete-macro]")) {
            e.stopPropagation();
            deleteMacro(e.target.getAttribute("data-delete-macro"));
            return;
        }
        if (e.target.matches("[data-add-sotto]")) {
            addSotto(e.target.getAttribute("data-add-sotto"));
            return;
        }
        if (e.target.matches("[data-delete-sotto]")) {
            var parts = e.target.getAttribute("data-delete-sotto").split("|");
            deleteSotto(parts[0], parts[1]);
            return;
        }
        if (e.target.matches("[data-add-terzo]")) {
            var parts = e.target.getAttribute("data-add-terzo").split("|");
            addTerzo(parts[0], parts[1]);
            return;
        }
        if (e.target.matches("[data-delete-terzo]")) {
            var parts = e.target.getAttribute("data-delete-terzo").split("|");
            deleteTerzo(parts[0], parts[1], parts[2]);
            return;
        }
        if (e.target.matches("[data-load-session]")) {
            loadSession(parseInt(e.target.getAttribute("data-load-session")));
            return;
        }
        if (e.target.matches("[data-delete-session]")) {
            deleteSession(parseInt(e.target.getAttribute("data-delete-session")));
            return;
        }
    });

    document.addEventListener("dragstart", handleDragStart);
    document.addEventListener("dragend", handleDragEnd);
    document.addEventListener("dragover", handleDragOver);
    document.addEventListener("dragleave", handleDragLeave);
    document.addEventListener("drop", handleDrop);
});

// [Resto delle funzioni logiche originali qui sotto...]
function enterSession() { /* ... */ }
function renderCards() { /* ... */ }
function renderMacros() { /* ... */ }
// ... eccetera
</script>
</body>
</html>
