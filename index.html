        *{margin:0;padding:0;box-sizing:border-box}

        .status-dot{width:8px;height:8px;border-radius:50%;background:#fbbf24}

        .users-online{font-size:11px;padding:5px 10px;background:rgba(255,255,255,.1);border-radius:20px}

        .btn-primary{background:#3b82f6;color:#fff}

        .btn-success{background:#22c55e;color:#fff}
        .btn-secondary{background:rgba(255,255,255,.2);color:#fff}

        .nav-bar{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:52px;z-index:999}
        .nav-label{font-size:12px;color:#64748b;font-weight:500;margin-right:8px}
        .nav-chip{padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;transition:all .2s;border:2px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap}

        .nav-chip.active{border-color:#1e293b;font-weight:600}
        .nav-chip .chip-count{background:rgba(255,255,255,.3);padding:1px 6px;border-radius:10px;font-size:10px}
        .chip-1{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
        .chip-2{background:linear-gradient(135deg,#f43f5e,#fb7185);color:#fff}
        .chip-3{background:linear-gradient(135deg,#0ea5e9,#38bdf8);color:#fff}
        .chip-4{background:linear-gradient(135deg,#22c55e,#4ade80);color:#fff}
        .chip-5{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#fff}
        .chip-6{background:linear-gradient(135deg,#ec4899,#f472b6);color:#fff}
        .chip-7{background:linear-gradient(135deg,#14b8a6,#2dd4bf);color:#fff}
        .chip-8{background:linear-gradient(135deg,#8b5cf6,#a78bfa);color:#fff}
        .chip-9{background:linear-gradient(135deg,#0891b2,#22d3ee);color:#fff}
        .expand-all-btn{margin-left:auto;padding:6px 12px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;font-size:11px;cursor:pointer;color:#64748b}
        .expand-all-btn:hover{background:#e2e8f0}
        .main-container{display:flex;height:calc(100vh - 100px)}
        .sidebar{width:360px;background:#fff;border-right:1px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0}
        .sidebar-header{padding:14px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
        .sidebar-header h2{font-size:13px;color:#1e293b;margin-bottom:8px}
        .search-box{width:100%;padding:8px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px}
        .search-box:focus{outline:none;border-color:#3b82f6}
        .filter-row{display:flex;gap:8px;margin-top:8px}
        .filter-btn{flex:1;padding:6px;font-size:10px;border:1px solid #e2e8f0;background:#fff;border-radius:4px;cursor:pointer}
        .filter-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
        .cards-container{flex:1;overflow-y:auto;padding:10px}
        .card-count{font-size:10px;color:#64748b;padding:6px 10px;background:#f1f5f9;border-radius:4px;margin-bottom:10px}
        .card-item{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab;transition:all .2s}
        .card-item:hover{border-color:#3b82f6;box-shadow:0 2px 8px rgba(59,130,246,.15)}
        .card-item.dragging{opacity:.5;cursor:grabbing}
        .card-item.assigned{border-left:3px solid #22c55e}
        .card-item.multi-assigned{border-left:3px solid #8b5cf6}
        .card-id{font-size:9px;color:#94a3b8;margin-bottom:2px}
        .card-label{font-size:12px;font-weight:500;color:#1e293b;margin-bottom:4px;line-height:1.3}
        .card-url{font-size:10px;color:#3b82f6;text-decoration:none;display:block;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .card-original-cat{font-size:10px;color:#1e40af;background:#dbeafe;padding:3px 8px;border-radius:4px;margin-bottom:6px;display:inline-block;font-weight:500}
        .card-locations{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
        .location-tag{font-size:9px;padding:2px 6px;background:#dcfce7;color:#166534;border-radius:4px;display:flex;align-items:center;gap:4px}
        .location-tag .remove-location{cursor:pointer;font-weight:700;font-size:10px}
        .location-tag .remove-location:hover{color:#dc2626}
        .board-area{flex:1;overflow-y:auto;padding:16px}
        .board-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
        .board-header h2{font-size:16px;color:#1e293b}
        .macro-area{background:#fff;border-radius:12px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden}
        .macro-area.collapsed .macro-content{display:none}
        .macro-header{padding:14px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
        .macro-header:hover{filter:brightness(1.05)}
        .macro-title{display:flex;align-items:center;gap:10px;flex:1}
        .macro-icon{font-size:18px}
        .macro-name-input{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:14px;font-weight:600;padding:4px 8px;border-radius:4px;width:280px}
        .macro-name-input::placeholder{color:rgba(255,255,255,.7)}
        .macro-badge{background:rgba(255,255,255,.2);padding:3px 10px;border-radius:12px;font-size:11px;margin-left:10px}
        .macro-actions{display:flex;gap:8px;align-items:center}
        .collapse-btn{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
        .collapse-btn:hover{background:rgba(255,255,255,.3)}
        .delete-macro-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px}
        .delete-macro-btn:hover{background:rgba(239,68,68,.8)}
        .macro-content{padding:14px}
        .sotto-categoria{background:#f8fafc;border:2px dashed #e2e8f0;border-radius:8px;margin-bottom:10px;min-height:60px;transition:all .2s}
        .sotto-categoria.drag-over{border-color:#3b82f6;background:#eff6ff}
        .sotto-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;background:#fff;border-radius:6px 6px 0 0}
        .sotto-name-input{border:none;background:transparent;font-size:13px;font-weight:600;color:#1e293b;width:220px}
        .sotto-name-input:focus{outline:none;background:#f1f5f9;padding:4px 8px;margin:-4px -8px;border-radius:4px}
        .sotto-count{font-size:10px;color:#64748b;background:#e2e8f0;padding:2px 8px;border-radius:10px}
        .sotto-cards{padding:10px;display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
        .sotto-card{background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:6px 10px;font-size:11px;cursor:pointer;max-width:180px;position:relative}
        .sotto-card:hover{border-color:#3b82f6}
        .sotto-card .card-id{font-size:8px}
        .sotto-card .card-mini-label{font-size:10px;color:#1e293b;line-height:1.2}
        .sotto-card .remove-card{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#fee2e2;color:#dc2626;font-size:9px;display:none;align-items:center;justify-content:center;cursor:pointer}
        .sotto-card:hover .remove-card{display:flex}
        .terzo-livello-container{margin-left:16px;padding-left:12px;border-left:2px solid #e2e8f0}
        .add-terzo-livello{font-size:10px;color:#64748b;cursor:pointer;padding:6px;text-align:center}
        .add-terzo-livello:hover{color:#3b82f6}
        .add-sotto-btn,.add-macro-btn{width:100%;padding:10px;border:2px dashed #cbd5e1;background:transparent;border-radius:8px;color:#64748b;cursor:pointer;font-size:12px;transition:all .2s}
        .add-sotto-btn:hover,.add-macro-btn:hover{border-color:#3b82f6;color:#3b82f6;background:#eff6ff}
        .delete-sotto-btn{background:transparent;border:none;color:#94a3b8;cursor:pointer;padding:4px;border-radius:4px;font-size:12px}
        .delete-sotto-btn:hover{background:#fee2e2;color:#dc2626}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:2000}

        .modal{background:#fff;border-radius:12px;padding:24px;width:420px;max-width:90%;max-height:90vh;overflow-y:auto}
        .modal h3{margin-bottom:16px;color:#1e293b}
        .modal-input{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:6px;font-size:13px;margin-bottom:10px}
        .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
        .user-modal{text-align:center}
        .user-modal h2{margin-bottom:8px}
        .user-modal p{color:#64748b;margin-bottom:20px;font-size:13px}

        .gradient-8{background:linear-gradient(135deg,#8b5cf6,#a78bfa)}
        .gradient-9{background:linear-gradient(135deg,#0891b2,#22d3ee)}

        .toast{background:#1e293b;color:#fff;padding:10px 16px;border-radius:8px;margin-top:8px;font-size:12px;animation:slideIn .3s ease}
        @keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        .toast.success{background:#22c55e}
        .toast.error{background:#ef4444}
        .toast.info{background:#3b82f6}
        .confirm-dialog{background:#fff;border-radius:12px;padding:24px;width:360px;text-align:center}
        .confirm-dialog h3{margin-bottom:12px}
        .confirm-dialog p{color:#64748b;font-size:13px;margin-bottom:20px}
        .confirm-dialog .btn-danger{background:#ef4444;color:#fff}
        .confirm-dialog .btn-danger:hover{background:#dc2626}

<body>
    <div class="modal-overlay active" id="userModal">
        <div class="modal user-modal">
            <h2>🏛️ Card Sorting</h2>
            <h3>Agenzia delle Entrate</h3>
            <p>Inserisci il tuo nome per iniziare</p>
            <input type="text" class="modal-input" id="usernameInput" placeholder="Il tuo nome..." maxlength="30">
            <div class="modal-actions" style="justify-content:center">
                <button class="btn btn-primary" onclick="enterSession()">Entra</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="cardDetailModal">
        <div class="modal">
            <h3>📝 Dettaglio Scheda</h3>
            <div id="cardDetailContent"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeCardDetail()" style="background:#e2e8f0;color:#1e293b">Chiudi</button>
                <button class="btn btn-primary" onclick="saveCardDetail()">Salva</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="confirmDialog">
        <div class="confirm-dialog">
            <h3 id="confirmTitle">Conferma</h3>
            <p id="confirmMessage">Sei sicuro?</p>
            <div class="modal-actions" style="justify-content:center">
                <button class="btn btn-secondary" onclick="closeConfirm()" style="background:#e2e8f0;color:#1e293b">Annulla</button>
                <button class="btn btn-danger" onclick="executeConfirm()">Elimina</button>
            </div>
        </div>
    </div>
    <div class="header">
        <h1>🏛️ Card Sorting - Agenzia delle Entrate</h1>
        <div class="header-actions">
            <div class="connection-status">
                <span class="status-dot" id="statusDot"></span>
                <span id="connectionText">Connessione...</span>
            </div>
            <div class="users-online" id="usersOnline">👤 1 utente</div>
            <button class="btn btn-secondary" onclick="saveToLocal()">💾 Salva</button>
            <button class="btn btn-success" onclick="exportToExcel()">📥 Excel</button>
        </div>
    </div>
    <div class="nav-bar" id="navBar">
        <span class="nav-label">Vai a:</span>
        <button class="expand-all-btn" onclick="toggleAllMacros()">
            <span id="expandAllText">▼ Espandi tutto</span>
        </button>
    </div>
    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>📋 Schede da classificare</h2>
                <input type="text" class="search-box" id="searchBox" placeholder="Cerca scheda..." oninput="filterCards()">
                <div class="filter-row">
                    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Tutte</button>
                    <button class="filter-btn" data-filter="unassigned" onclick="setFilter('unassigned')">Da fare</button>
                    <button class="filter-btn" data-filter="assigned" onclick="setFilter('assigned')">Fatte</button>
                </div>
            </div>
            <div class="cards-container" id="cardsContainer">
                <div class="card-count" id="cardCount">Caricamento...</div>
            </div>
        </div>
        <div class="board-area" id="boardArea">
            <div class="board-header">
                <h2>📊 Struttura delle Macro-aree</h2>
                <button class="btn btn-primary" onclick="addMacroArea()">+ Nuova Macro-area</button>
            </div>
            <div id="macroAreasContainer"></div>
            <button class="add-macro-btn" onclick="addMacroArea()">+ Aggiungi nuova Macro-area</button>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>

function initFirebase(){try{if(firebaseConfig.apiKey==="YOUR_API_KEY"){initLocalMode();return}firebase.initializeApp(firebaseConfig);db=firebase.database();db.ref('.info/connected').on('value',s=>{if(s.val()===true){setOnlineStatus(true);syncWithFirebase()}else{setOnlineStatus(false)}})}catch(e){initLocalMode()}}
function initLocalMode(){setOnlineStatus(false,true);loadFromLocal()}
function setOnlineStatus(online,localOnly=false){isOnline=online;const dot=document.getElementById('statusDot'),text=document.getElementById('connectionText');if(localOnly){dot.className='status-dot offline';text.textContent='Modalità locale'}else if(online){dot.className='status-dot online';text.textContent='Connesso'}else{dot.className='status-dot';text.textContent='Riconnessione...'}}
function syncWithFirebase(){if(!db)return;db.ref('cards').on('value',s=>{const d=s.val();if(d){cardsData=d}else{cardsData=JSON.parse(JSON.stringify(initialCardsData));db.ref('cards').set(cardsData)}renderCards();renderNavChips()});db.ref('structure').on('value',s=>{const d=s.val();if(d){structureData=d}else{structureData=JSON.parse(JSON.stringify(initialStructure));db.ref('structure').set(structureData)}renderMacroAreas();renderNavChips()});if(currentUser){const odIdc='user_'+Date.now()+'_'+Math.random().toString(36).substr(2,9);const userRef=db.ref('users/'+odIdc);userRef.set({name:currentUser.name,lastActive:firebase.database.ServerValue.TIMESTAMP});userRef.onDisconnect().remove();db.ref('users').on('value',s=>{const users=s.val()||{};const count=Object.keys(users).length;document.getElementById('usersOnline').textContent=`👤 ${count} utent${count===1?'e':'i'}`})}}
function saveToFirebase(path,data){if(db&&isOnline){db.ref(path).set(data)}saveToLocalStorage()}
function loadFromLocal(){const sc=localStorage.getItem('cardSorting_cards_v3'),ss=localStorage.getItem('cardSorting_structure_v3');if(sc){cardsData=JSON.parse(sc)}else{cardsData=JSON.parse(JSON.stringify(initialCardsData))}if(ss){structureData=JSON.parse(ss)}else{structureData=JSON.parse(JSON.stringify(initialStructure))}renderCards();renderMacroAreas();renderNavChips()}
function saveToLocalStorage(){localStorage.setItem('cardSorting_cards_v3',JSON.stringify(cardsData));localStorage.setItem('cardSorting_structure_v3',JSON.stringify(structureData))}
function saveToLocal(){saveToLocalStorage();showToast('Salvato in locale','success')}
function enterSession(){const username=document.getElementById('usernameInput').value.trim();if(!username){showToast('Inserisci un nome','error');return}currentUser={id:'user_'+Date.now(),name:username};document.getElementById('userModal').classList.remove('active');initFirebase()}
document.getElementById('usernameInput').addEventListener('keypress',e=>{if(e.key==='Enter')enterSession()});
function renderNavChips(){const navBar=document.getElementById('navBar');navBar.querySelectorAll('.nav-chip').forEach(c=>c.remove());const expandBtn=navBar.querySelector('.expand-all-btn');structureData.macroAreas.forEach((macro,i)=>{const count=countCardsInMacro(macro.id);const chip=document.createElement('div');chip.className=`nav-chip chip-${(i%9)+1}`;chip.innerHTML=`<span>${macro.icon||defaultIcons[i%defaultIcons.length]}</span><span>${macro.name.length>20?macro.name.substring(0,20)+'...':macro.name}</span><span class="chip-count">${count}</span>`;chip.onclick=()=>scrollToMacro(macro.id);navBar.insertBefore(chip,expandBtn)})}
function scrollToMacro(macroId){const el=document.querySelector(`[data-macro-id="${macroId}"]`);if(el){el.classList.remove('collapsed');const y=el.getBoundingClientRect().top+window.pageYOffset-120;window.scrollTo({top:y,behavior:'smooth'});el.style.boxShadow='0 0 0 3px #3b82f6';setTimeout(()=>{el.style.boxShadow=''},2000)}}
function toggleAllMacros(){allExpanded=!allExpanded;document.querySelectorAll('.macro-area').forEach(m=>{if(allExpanded){m.classList.remove('collapsed')}else{m.classList.add('collapsed')}});document.getElementById('expandAllText').textContent=allExpanded?'▲ Comprimi tutto':'▼ Espandi tutto'}
function renderCards(){const container=document.getElementById('cardsContainer');const searchTerm=document.getElementById('searchBox').value.toLowerCase();const totalCards=Object.keys(cardsData).length;const assignedCards=Object.values(cardsData).filter(c=>c.locations&&c.locations.length>0).length;let html=`<div class="card-count">${totalCards} totali | ${assignedCards} assegnate | ${totalCards-assignedCards} da fare</div>`;const cards=Object.entries(cardsData).filter(([id,card])=>{const searchIn=(card.label+' '+(card.altLabel||'')+' '+id+' '+(card.originalMacro||'')).toLowerCase();if(!searchIn.includes(searchTerm))return false;const isAssigned=card.locations&&card.locations.length>0;if(currentFilter==='assigned'&&!isAssigned)return false;if(currentFilter==='unassigned'&&isAssigned)return false;return true}).sort((a,b)=>{const aA=a[1].locations&&a[1].locations.length>0;const bA=b[1].locations&&b[1].locations.length>0;if(aA!==bA)return aA?1:-1;return parseInt(a[0])-parseInt(b[0])});for(const[id,card]of cards){const isAssigned=card.locations&&card.locations.length>0;const isMulti=card.locations&&card.locations.length>1;html+=`<div class="card-item ${isAssigned?'assigned':''} ${isMulti?'multi-assigned':''}" draggable="true" data-card-id="${id}" ondragstart="onDragStart(event)" ondragend="onDragEnd(event)" onclick="openCardDetail('${id}')"><div class="card-id">ID ${id}</div><div class="card-label">${card.altLabel||card.label}</div>${card.originalMacro?`<div class="card-original-cat">📁 ${card.originalMacro}</div>`:''} ${card.url?`<a href="${card.url}" target="_blank" class="card-url" onclick="event.stopPropagation()">${card.url.substring(0,45)}...</a>`:''} ${isAssigned?`<div class="card-locations">${card.locations.map(loc=>`<span class="location-tag">${(loc.sotto||loc.macro||'').substring(0,18)}${(loc.sotto||loc.macro||'').length>18?'...':''}<span class="remove-location" onclick="event.stopPropagation();removeCardFromLocation('${id}','${loc.macroId}','${loc.sottoId}',${loc.terzoId?`'${loc.terzoId}'`:'null'})">&times;</span></span>`).join('')}</div>`:''}</div>`}container.innerHTML=html}
function filterCards(){renderCards()}
function setFilter(filter){currentFilter=filter;document.querySelectorAll('.filter-btn').forEach(btn=>{btn.classList.toggle('active',btn.dataset.filter===filter)});renderCards()}
function renderMacroAreas(){const container=document.getElementById('macroAreasContainer');let html='';structureData.macroAreas.forEach((macro,i)=>{const gradientClass=gradients[i%gradients.length];const icon=macro.icon||defaultIcons[i%defaultIcons.length];const cardCount=countCardsInMacro(macro.id);html+=`<div class="macro-area" data-macro-id="${macro.id}"><div class="macro-header ${gradientClass}" onclick="toggleMacro('${macro.id}')"><div class="macro-title"><span class="macro-icon">${icon}</span><input type="text" class="macro-name-input" value="${macro.name}" onclick="event.stopPropagation()" onchange="updateMacroName('${macro.id}',this.value)" placeholder="Nome macro-area"><span class="macro-badge">${cardCount} schede</span></div><div class="macro-actions"><button class="collapse-btn" onclick="event.stopPropagation();toggleMacro('${macro.id}')">▼</button><button class="delete-macro-btn" onclick="event.stopPropagation();deleteMacroArea('${macro.id}')">🗑️</button></div></div><div class="macro-content">${(macro.sottoCategorie||[]).map(sotto=>renderSottoCategoria(macro.id,sotto)).join('')}<button class="add-sotto-btn" onclick="addSottoCategoria('${macro.id}')">+ Aggiungi sotto-categoria</button></div></div>`});container.innerHTML=html}
function toggleMacro(macroId){const el=document.querySelector(`[data-macro-id="${macroId}"]`);if(el)el.classList.toggle('collapsed')}
function renderSottoCategoria(macroId,sotto){const cards=getCardsInSotto(macroId,sotto.id);return`<div class="sotto-categoria" data-macro-id="${macroId}" data-sotto-id="${sotto.id}" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)"><div class="sotto-header"><input type="text" class="sotto-name-input" value="${sotto.name}" onchange="updateSottoName('${macroId}','${sotto.id}',this.value)" placeholder="Nome sotto-categoria"><div style="display:flex;align-items:center;gap:6px"><span class="sotto-count">${cards.length}</span><button class="delete-sotto-btn" onclick="deleteSottoCategoria('${macroId}','${sotto.id}')">🗑️</button></div></div><div class="sotto-cards">${cards.map(cardId=>renderSottoCard(cardId,macroId,sotto.id)).join('')}${cards.length===0?'<span style="color:#94a3b8;font-size:11px;padding:8px">Trascina qui le schede</span>':''}</div>${sotto.terzoLivello&&sotto.terzoLivello.length>0?`<div class="terzo-livello-container">${sotto.terzoLivello.map(terzo=>renderTerzoLivello(macroId,sotto.id,terzo)).join('')}</div>`:''}<div class="add-terzo-livello" onclick="addTerzoLivello('${macroId}','${sotto.id}')">+ 3° livello</div></div>`}
function renderTerzoLivello(macroId,sottoId,terzo){const cards=getCardsInTerzo(macroId,sottoId,terzo.id);return`<div class="sotto-categoria" data-macro-id="${macroId}" data-sotto-id="${sottoId}" data-terzo-id="${terzo.id}" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)" style="margin-top:6px;background:#f1f5f9"><div class="sotto-header" style="padding:8px 12px"><input type="text" class="sotto-name-input" value="${terzo.name}" onchange="updateTerzoName('${macroId}','${sottoId}','${terzo.id}',this.value)" placeholder="3° livello" style="font-size:12px"><div style="display:flex;align-items:center;gap:6px"><span class="sotto-count">${cards.length}</span><button class="delete-sotto-btn" onclick="deleteTerzoLivello('${macroId}','${sottoId}','${terzo.id}')">🗑️</button></div></div><div class="sotto-cards">${cards.map(cardId=>renderSottoCard(cardId,macroId,sottoId,terzo.id)).join('')}${cards.length===0?'<span style="color:#94a3b8;font-size:10px">Trascina qui</span>':''}</div></div>`}
function renderSottoCard(cardId,macroId,sottoId,terzoId=null){const card=cardsData[cardId];if(!card)return'';return`<div class="sotto-card" onclick="openCardDetail('${cardId}')"><div class="card-id">ID ${cardId}</div><div class="card-mini-label">${(card.altLabel||card.label).substring(0,40)}${(card.altLabel||card.label).length>40?'...':''}</div><div class="remove-card" onclick="event.stopPropagation();removeCardFromLocation('${cardId}','${macroId}','${sottoId}',${terzoId?`'${terzoId}'`:'null'})">&times;</div></div>`}
function onDragStart(e){const cardId=e.target.dataset.cardId;e.dataTransfer.setData('text/plain',cardId);e.target.classList.add('dragging')}
function onDragEnd(e){e.target.classList.remove('dragging')}
function onDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over')}
function onDragLeave(e){e.currentTarget.classList.remove('drag-over')}
function onDrop(e){e.preventDefault();e.currentTarget.classList.remove('drag-over');const cardId=e.dataTransfer.getData('text/plain');const macroId=e.currentTarget.dataset.macroId;const sottoId=e.currentTarget.dataset.sottoId;const terzoId=e.currentTarget.dataset.terzoId||null;addCardToLocation(cardId,macroId,sottoId,terzoId)}
function addCardToLocation(cardId,macroId,sottoId,terzoId=null){if(!cardsData[cardId])return;if(!cardsData[cardId].locations)cardsData[cardId].locations=[];const exists=cardsData[cardId].locations.some(loc=>loc.macroId===macroId&&loc.sottoId===sottoId&&loc.terzoId===terzoId);if(exists){showToast('Scheda già presente qui','info');return}const macro=structureData.macroAreas.find(m=>m.id===macroId);const sotto=macro?.sottoCategorie?.find(s=>s.id===sottoId);const terzo=terzoId&&sotto?.terzoLivello?sotto.terzoLivello.find(t=>t.id===terzoId):null;cardsData[cardId].locations.push({macroId,sottoId,terzoId,macro:macro?.name||'',sotto:sotto?.name||'',terzo:terzo?.name||''});cardsData[cardId].lastModifiedBy=currentUser?.name;cardsData[cardId].lastModified=new Date().toISOString();saveToFirebase('cards',cardsData);renderCards();renderMacroAreas();renderNavChips();showToast(`Scheda aggiunta a "${sotto?.name||'categoria'}"`,'success')}
function removeCardFromLocation(cardId,macroId,sottoId,terzoId=null){if(!cardsData[cardId]?.locations)return;cardsData[cardId].locations=cardsData[cardId].locations.filter(loc=>{if(terzoId){return!(loc.macroId===macroId&&loc.sottoId===sottoId&&loc.terzoId===terzoId)}else{return!(loc.macroId===macroId&&loc.sottoId===sottoId&&!loc.terzoId)}});saveToFirebase('cards',cardsData);renderCards();renderMacroAreas();renderNavChips();showToast('Scheda rimossa','info')}
function getCardsInSotto(macroId,sottoId){return Object.entries(cardsData).filter(([id,card])=>card.locations?.some(loc=>loc.macroId===macroId&&loc.sottoId===sottoId&&!loc.terzoId)).map(([id])=>id)}
function getCardsInTerzo(macroId,sottoId,terzoId){return Object.entries(cardsData).filter(([id,card])=>card.locations?.some(loc=>loc.macroId===macroId&&loc.sottoId===sottoId&&loc.terzoId===terzoId)).map(([id])=>id)}
function countCardsInMacro(macroId){return Object.values(cardsData).filter(card=>card.locations?.some(loc=>loc.macroId===macroId)).length}
function openCardDetail(cardId){selectedCardId=cardId;const card=cardsData[cardId];document.getElementById('cardDetailContent').innerHTML=`<div style="margin-bottom:14px"><label style="display:block;font-size:11px;color:#64748b;margin-bottom:3px">ID</label><div style="font-weight:600;font-size:14px">${cardId}</div></div><div style="margin-bottom:14px"><label style="display:block;font-size:11px;color:#64748b;margin-bottom:3px">Label originale</label><div style="font-size:13px">${card.label}</div></div>${card.originalMacro?`<div style="margin-bottom:14px"><label style="display:block;font-size:11px;color:#64748b;margin-bottom:3px">Categoria ASIS (attuale)</label><div style="font-size:12px;background:#dbeafe;padding:6px 10px;border-radius:4px;color:#1e40af;font-weight:500">${card.originalMacro}</div></div>`:''}<div style="margin-bottom:14px"><label style="display:block;font-size:11px;color:#64748b;margin-bottom:3px">URL</label>${card.url?`<a href="${card.url}" target="_blank" style="font-size:12px;color:#3b82f6;word-break:break-all">${card.url}</a>`:'<span style="color:#94a3b8;font-size:12px">Nessun URL</span>'}</div><div style="margin-bottom:14px"><label style="display:block;font-size:11px;color:#64748b;margin-bottom:3px">Label alternativa proposta</label><input type="text" id="altLabelInput" class="modal-input" value="${card.altLabel||''}" placeholder="Proponi una nuova label..." style="margin-bottom:0"></div><div style="margin-bottom:14px"><label style="display:block;font-size:11px;color:#64748b;margin-bottom:3px">Note</label><textarea id="cardNotesInput" class="modal-input" rows="3" placeholder="Aggiungi note..." style="margin-bottom:0;resize:vertical">${card.notes||''}</textarea></div>${card.lastModifiedBy?`<div style="font-size:10px;color:#94a3b8;padding-top:8px;border-top:1px solid #e2e8f0">Ultima modifica: ${card.lastModifiedBy} - ${new Date(card.lastModified).toLocaleString('it-IT')}</div>`:''}`;document.getElementById('cardDetailModal').classList.add('active')}
function closeCardDetail(){document.getElementById('cardDetailModal').classList.remove('active');selectedCardId=null}
function saveCardDetail(){if(!selectedCardId)return;const altLabel=document.getElementById('altLabelInput').value.trim();const notes=document.getElementById('cardNotesInput').value.trim();cardsData[selectedCardId].altLabel=altLabel||null;cardsData[selectedCardId].notes=notes||null;cardsData[selectedCardId].lastModifiedBy=currentUser?.name;cardsData[selectedCardId].lastModified=new Date().toISOString();saveToFirebase('cards',cardsData);renderCards();renderMacroAreas();closeCardDetail();showToast('Scheda aggiornata','success')}
function showConfirm(title,message,callback){document.getElementById('confirmTitle').textContent=title;document.getElementById('confirmMessage').textContent=message;confirmCallback=callback;document.getElementById('confirmDialog').classList.add('active')}
function closeConfirm(){document.getElementById('confirmDialog').classList.remove('active');confirmCallback=null}
function executeConfirm(){if(confirmCallback)confirmCallback();closeConfirm()}
function addMacroArea(){const newId='macro_'+Date.now();if(!structureData.macroAreas)structureData.macroAreas=[];structureData.macroAreas.push({id:newId,name:'Nuova Macro-area',icon:defaultIcons[structureData.macroAreas.length%defaultIcons.length],description:'',sottoCategorie:[{id:'sotto_'+Date.now(),name:'Nuova sotto-categoria',terzoLivello:[]}]});saveToFirebase('structure',structureData);renderMacroAreas();renderNavChips();showToast('Macro-area aggiunta','success')}
function deleteMacroArea(macroId){showConfirm('🗑️ Elimina macro-area','Eliminare questa macro-area?',()=>{Object.keys(cardsData).forEach(cardId=>{if(cardsData[cardId].locations){cardsData[cardId].locations=cardsData[cardId].locations.filter(loc=>loc.macroId!==macroId)}});structureData.macroAreas=structureData.macroAreas.filter(m=>m.id!==macroId);saveToFirebase('cards',cardsData);saveToFirebase('structure',structureData);renderCards();renderMacroAreas();renderNavChips();showToast('Macro-area eliminata','info')})}
function updateMacroName(macroId,newName){const macro=structureData.macroAreas.find(m=>m.id===macroId);if(macro){macro.name=newName;Object.keys(cardsData).forEach(cardId=>{if(cardsData[cardId].locations){cardsData[cardId].locations.forEach(loc=>{if(loc.macroId===macroId)loc.macro=newName})}});saveToFirebase('structure',structureData);saveToFirebase('cards',cardsData);renderNavChips()}}
function addSottoCategoria(macroId){const macro=structureData.macroAreas.find(m=>m.id===macroId);if(macro){if(!macro.sottoCategorie)macro.sottoCategorie=[];macro.sottoCategorie.push({id:'sotto_'+Date.now(),name:'Nuova sotto-categoria',terzoLivello:[]});saveToFirebase('structure',structureData);renderMacroAreas();showToast('Sotto-categoria aggiunta','success')}}
function deleteSottoCategoria(macroId,sottoId){showConfirm('🗑️ Elimina sotto-categoria','Eliminare questa sotto-categoria?',()=>{const macro=structureData.macroAreas.find(m=>m.id===macroId);if(macro){macro.sottoCategorie=macro.sottoCategorie.filter(s=>s.id!==sottoId);Object.keys(cardsData).forEach(cardId=>{if(cardsData[cardId].locations){cardsData[cardId].locations=cardsData[cardId].locations.filter(loc=>!(loc.macroId===macroId&&loc.sottoId===sottoId))}});saveToFirebase('structure',structureData);saveToFirebase('cards',cardsData);renderCards();renderMacroAreas();renderNavChips();showToast('Sotto-categoria eliminata','info')}})}
function updateSottoName(macroId,sottoId,newName){const macro=structureData.macroAreas.find(m=>m.id===macroId);const sotto=macro?.sottoCategorie?.find(s=>s.id===sottoId);if(sotto){sotto.name=newName;Object.keys(cardsData).forEach(cardId=>{if(cardsData[cardId].locations){cardsData[cardId].locations.forEach(loc=>{if(loc.macroId===macroId&&loc.sottoId===sottoId)loc.sotto=newName})}});saveToFirebase('structure',structureData);saveToFirebase('cards',cardsData)}}
function addTerzoLivello(macroId,sottoId){const macro=structureData.macroAreas.find(m=>m.id===macroId);const sotto=macro?.sottoCategorie?.find(s=>s.id===sottoId);if(sotto){if(!sotto.terzoLivello)sotto.terzoLivello=[];sotto.terzoLivello.push({id:'terzo_'+Date.now(),name:'Nuovo 3° livello'});saveToFirebase('structure',structureData);renderMacroAreas();showToast('3° livello aggiunto','success')}}
function deleteTerzoLivello(macroId,sottoId,terzoId){showConfirm('🗑️ Elimina 3° livello','Eliminare questo 3° livello?',()=>{const macro=structureData.macroAreas.find(m=>m.id===macroId);const sotto=macro?.sottoCategorie?.find(s=>s.id===sottoId);if(sotto?.terzoLivello){sotto.terzoLivello=sotto.terzoLivello.filter(t=>t.id!==terzoId);Object.keys(cardsData).forEach(cardId=>{if(cardsData[cardId].locations){cardsData[cardId].locations=cardsData[cardId].locations.filter(loc=>!(loc.macroId===macroId&&loc.sottoId===sottoId&&loc.terzoId===terzoId))}});saveToFirebase('structure',structureData);saveToFirebase('cards',cardsData);renderCards();renderMacroAreas();showToast('3° livello eliminato','info')}})}
function updateTerzoName(macroId,sottoId,terzoId,newName){const macro=structureData.macroAreas.find(m=>m.id===macroId);const sotto=macro?.sottoCategorie?.find(s=>s.id===sottoId);const terzo=sotto?.terzoLivello?.find(t=>t.id===terzoId);if(terzo){terzo.name=newName;Object.keys(cardsData).forEach(cardId=>{if(cardsData[cardId].locations){cardsData[cardId].locations.forEach(loc=>{if(loc.macroId===macroId&&loc.sottoId===sottoId&&loc.terzoId===terzoId)loc.terzo=newName})}});saveToFirebase('structure',structureData);saveToFirebase('cards',cardsData)}}
function exportToExcel(){const rows=[['ID','URL','Label Originale','Label Proposta','Categoria ASIS','Nuova Macro-area','Nuova Sotto-categoria','Nuovo 3° Livello','Note','Modificato da','Data']];Object.entries(cardsData).forEach(([id,card])=>{if(card.locations&&card.locations.length>0){card.locations.forEach(loc=>{rows.push([id,card.url||'',card.label,card.altLabel||'',card.originalMacro||'',loc.macro||'',loc.sotto||'',loc.terzo||'',card.notes||'',card.lastModifiedBy||'',card.lastModified?new Date(card.lastModified).toLocaleString('it-IT'):''])})}else{rows.push([id,card.url||'',card.label,card.altLabel||'',card.originalMacro||'','','','',card.notes||'',card.lastModifiedBy||'',card.lastModified?new Date(card.lastModified).toLocaleString('it-IT'):''])}});const ws=XLSX.utils.aoa_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Card Sorting');const structureRows=[['Macro-area','Sotto-categoria','3° Livello','N. Schede']];structureData.macroAreas.forEach(macro=>{(macro.sottoCategorie||[]).forEach(sotto=>{const cards=getCardsInSotto(macro.id,sotto.id);structureRows.push([macro.name,sotto.name,'',cards.length]);if(sotto.terzoLivello){sotto.terzoLivello.forEach(terzo=>{const terzoCards=getCardsInTerzo(macro.id,sotto.id,terzo.id);structureRows.push([macro.name,sotto.name,terzo.name,terzoCards.length])})}})});const ws2=XLSX.utils.aoa_to_sheet(structureRows);XLSX.utils.book_append_sheet(wb,ws2,'Struttura');const date=new Date().toISOString().split('T')[0];XLSX.writeFile(wb,`CardSorting_AE_${date}.xlsx`);showToast('Excel esportato!','success')}
function showToast(message,type='info'){const container=document.getElementById('toastContainer');const toast=document.createElement('div');toast.className=`toast ${type}`;toast.textContent=message;container.appendChild(toast);setTimeout(()=>toast.remove(),3000)}
document.getElementById('usernameInput').focus();
    </script>
</body>
